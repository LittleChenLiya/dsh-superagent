  async function bootstrap() {
    try {
      const data = await api('/api/console/bootstrap', { method: 'POST' })
      applyBootstrap(data)
      if (STATE.router) refreshRouter().catch(() => {})
      if (STATE.router || (data.mode === 'chat' && data.sessionId)) connectEvents()
      else setConn('warn', '未连接')
    } catch (error) {
      if (error.status === 401) {
        showGate('token 无效或已换新，重新读一次 console.json。')
        return
      }
      setMode('unavailable', { chat: false, reason: `${messageOf(error)}${error.hint ? `\n${error.hint}` : ''}` })
      setConn('warn', '连接失败')
      renderEmpty()
      pushToast(`无法启动对话：${messageOf(error)}`, 'err')
    }
  }

  async function connectEvents() {
    if (!STATE.sessionId && !STATE.router) return
    if (STATE.streamAbort) STATE.streamAbort.abort()
    const controller = new AbortController()
    STATE.streamAbort = controller
    setConn('warn', '连接流中')
    try {
      const response = await fetch(STATE.router ? '/api/console/events' : `/api/console/events?sessionId=${encodeURIComponent(STATE.sessionId)}`, {
        headers: { authorization: `Bearer ${STATE.token}` },
        signal: controller.signal,
      })
      if (!response.ok) {
        const payload = await response.json().catch(() => null)
        const error = new Error(payload?.error?.summary || `HTTP ${response.status}`)
        error.status = response.status
        throw error
      }
      setConn('live', '已连接')
      const reader = response.body.getReader()
      const decoder = new TextDecoder()
      let buffer = ''
      while (true) {
        const { value, done } = await reader.read()
        if (done) break
        buffer += decoder.decode(value, { stream: true })
        let cut = buffer.indexOf('\n\n')
        while (cut >= 0) {
          const block = buffer.slice(0, cut)
          buffer = buffer.slice(cut + 2)
          for (const line of block.split('\n')) {
            if (!line.startsWith('data:')) continue
            const raw = line.slice(5).trimStart()
            if (!raw) continue
            try {
              handleFrame(JSON.parse(raw))
            } catch {
              // A malformed frame is ignored; the next one may be valid.
            }
          }
          cut = buffer.indexOf('\n\n')
        }
      }
      if (!controller.signal.aborted) {
        setConn('warn', '重连中')
        scheduleReconnect()
      }
    } catch (error) {
      if (controller.signal.aborted) return
      if (error.status === 401) {
        showGate('token 无效或已换新，重新读一次 console.json。')
        return
      }
      setConn('warn', '重连中')
      scheduleReconnect()
    }
  }

  function scheduleReconnect() {
    if (STATE.reconnectTimer) return
    STATE.reconnectTimer = setTimeout(() => {
      STATE.reconnectTimer = null
      if (STATE.mode === 'chat' && (STATE.sessionId || STATE.router)) connectEvents()
    }, 1200)
  }

  // ---------- composer ----------

  function renderRouterMessages(data) {
    if (!data || data.revision < (STATE.routerRevision ?? -1)) return
    STATE.routerRevision = data.revision
    clearMessages()
    for (const message of data.messages ?? []) addMessage(message.role, message.text, { at: message.at })
    if (STATE.messages.length === 0) renderEmpty()
    setTyping(data.pending > 0, '正在处理消息…')
    renderApprovals()
  }

  async function refreshRouter() {
    const [router, runs] = await Promise.all([api('/api/console/router'), api('/api/console/runs')])
    renderRouterMessages(router)
    STATE.runs = runs.runs ?? []
    renderLanes()
    renderRail()
    refreshNotices()
  }

  async function sendMessage() {
    const text = inputEl.value.trim()
    if (!text || STATE.sending || STATE.mode !== 'chat') return
    STATE.sending = true
    updateSend()
    if (STATE.router) {
      try {
        if (STATE.pendingRouterSend?.text !== text) STATE.pendingRouterSend = { text, id: crypto.randomUUID() }
        await api('/api/console/message', { method: 'POST', body: STATE.pendingRouterSend })
        STATE.pendingRouterSend = null
        if (inputEl.value.trim() === text) inputEl.value = ''
        autoGrow()
        await refreshRouter().catch(() => {})
      } catch (error) {
        pushToast(`发送失败：${messageOf(error)}`, 'err')
      } finally {
        STATE.sending = false
        updateSend()
        inputEl.focus()
      }
      return
    }
    inputEl.value = ''
    autoGrow()
    removeEmpty()
    const optimistic = addMessage('user', text, { pending: true, at: Date.now() })
    try {
      await api('/api/console/message', {
        method: 'POST',
        body: { sessionId: STATE.sessionId, text, mode: STATE.sendMode },
      })
      optimistic.pending = false
      refreshMessage(optimistic)
    } catch (error) {
      optimistic.pending = false
      optimistic.failed = true
      refreshMessage(optimistic)
      pushToast(`发送失败：${messageOf(error)}`, 'err')
    } finally {
      STATE.sending = false
      updateSend()
      inputEl.focus()
    }
  }

  async function newConversation() {
    if (STATE.mode !== 'chat') return
    newChatEl.disabled = true
    try {
      const data = await api('/api/console/session', { method: 'POST' })
      if (STATE.streamAbort) STATE.streamAbort.abort()
      setSession(data.sessionId)
      STATE.approvals.clear()
      STATE.cancelRequested.clear()
      STATE.railDetail = null
      clearMessages()
      STATE.runs = []
      renderLanes()
      refreshNotices()
      renderEmpty()
      renderTools(null)
      loadTools()
      loadSchedules()
      pushToast('已开始新对话。', 'ok')
      connectEvents()
    } catch (error) {
      pushToast(`无法新建对话：${messageOf(error)}`, 'err')
    } finally {
      newChatEl.disabled = STATE.mode !== 'chat'
    }
  }

  // ---------- gate ----------

  function showGate(errorText) {
    gateEl.hidden = false
    gateErrorEl.textContent = errorText || ''
    setTimeout(() => tokenInputEl.focus(), 30)
  }

  function hideGate() {
    gateEl.hidden = true
  }

  function readTokenFromUrl() {
    const url = new URL(window.location.href)
    const queryToken = url.searchParams.get('token')
    if (queryToken) {
      STATE.token = queryToken
      try { sessionStorage.setItem(TOKEN_KEY, queryToken) } catch {}
      url.searchParams.delete('token')
      window.history.replaceState({}, '', url.pathname + url.search + url.hash)
      return true
    }
    return false
  }

  function loadStoredToken() {
    try {
      return sessionStorage.getItem(TOKEN_KEY) || ''
    } catch {
      return ''
    }
  }

  // ---------- drawers ----------

  function drawerOpen(which) {
    const target = which === 'history' ? historyDrawerEl : advancedDrawerEl
    historyDrawerEl.hidden = target !== historyDrawerEl
    advancedDrawerEl.hidden = target !== advancedDrawerEl
    scrimEl.hidden = false
    target.hidden = false
    if (which === 'history') {
      renderHistory()
      loadSessions()
    }
    else renderAdvancedRuns()
  }

  function drawerClose() {
    historyDrawerEl.hidden = true
    advancedDrawerEl.hidden = true
    scrimEl.hidden = true
  }

  // ---------- wiring ----------

  messagesEl.addEventListener('scroll', () => {
    const distance = messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight
    STATE.autoScroll = distance < 80
  })

  inputEl.addEventListener('input', () => {
    autoGrow()
    updateSend()
  })

  inputEl.addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
      event.preventDefault()
      sendMessage()
    }
  })

  composerEl.addEventListener('submit', event => {
    event.preventDefault()
    sendMessage()
  })

  // A file can be dropped anywhere on the composer, or pasted into the text
  // box; both end up copied into the conversation's workspace, with the path
  // written into the message so the agent can read it.
  for (const type of ['dragenter', 'dragover']) {
    composerEl.addEventListener(type, event => {
      if (!dragHasFiles(event)) return
      event.preventDefault()
      if (event.dataTransfer) event.dataTransfer.dropEffect = 'copy'
      STATE.dragDepth += 1
      composerEl.classList.add('dragover')
    })
  }
  composerEl.addEventListener('dragleave', () => {
    STATE.dragDepth = Math.max(0, STATE.dragDepth - 1)
    if (STATE.dragDepth === 0) composerEl.classList.remove('dragover')
  })
  composerEl.addEventListener('drop', event => {
    if (!dragHasFiles(event)) return
    event.preventDefault()
    STATE.dragDepth = 0
    composerEl.classList.remove('dragover')
    uploadFiles(event.dataTransfer ? event.dataTransfer.files : null)
  })
  inputEl.addEventListener('paste', event => {
    const files = event.clipboardData ? event.clipboardData.files : null
    if (!files || files.length === 0) return
    event.preventDefault()
    uploadFiles(files)
  })

  noticeOpenEl.addEventListener('click', event => {
    event.stopPropagation()
    if (STATE.noticeOpen) closeNoticePanel()
    else openNoticePanel()
  })
  $('noticeReadAll').addEventListener('click', event => {
    event.stopPropagation()
    markNoticesRead(STATE.notices.map(notice => notice.id))
  })
  noticePanelEl.addEventListener('click', event => event.stopPropagation())
  document.addEventListener('click', () => {
    if (STATE.noticeOpen) closeNoticePanel()
  })

  for (const button of document.querySelectorAll('.segmented button')) {
    button.addEventListener('click', () => {
      STATE.sendMode = button.dataset.mode === 'steer' ? 'steer' : 'queue'
      for (const peer of document.querySelectorAll('.segmented button')) {
        peer.classList.toggle('active', peer === button)
      }
    })
  }

  newChatEl.addEventListener('click', newConversation)
  stopAllEl.addEventListener('click', stopAllRuns)
  railToggleEl.addEventListener('click', () => {
    setRail(!document.body.classList.contains('rail-collapsed'))
  })
  restoreRail()
  renderRail()
  setInterval(() => {
    tickLaneClocks()
    tickRailClocks()
    updateApprovalClocks()
  }, 1000)
  setInterval(() => {
    if (STATE.mode === 'chat') loadSchedules()
  }, 5000)
  $('historyOpen').addEventListener('click', () => drawerOpen('history'))
  $('advancedOpen').addEventListener('click', () => drawerOpen('advanced'))
  for (const button of document.querySelectorAll('[data-close]')) {
    button.addEventListener('click', drawerClose)
  }
  scrimEl.addEventListener('click', drawerClose)
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return
    if (wizardDialogEl.open) return
    drawerClose()
  })
  $('wizardOpen').addEventListener('click', () => wizardOpen(1))
  $('envWizard').addEventListener('click', () => wizardOpen(1))
  $('wizardClose').addEventListener('click', wizardClose)
  wizardDialogEl.addEventListener('click', event => {
    if (event.target === wizardDialogEl) wizardClose()
  })
  wizardDialogEl.addEventListener('close', () => { WIZ.open = false })
  $('dialogClose').addEventListener('click', () => reportDialogEl.close())
  reportDialogEl.addEventListener('click', event => {
    if (event.target === reportDialogEl) reportDialogEl.close()
  })

  gateFormEl.addEventListener('submit', event => {
    event.preventDefault()
    const token = tokenInputEl.value.trim()
    if (!token) return
    STATE.token = token
    try { sessionStorage.setItem(TOKEN_KEY, token) } catch {}
    tokenInputEl.value = ''
    hideGate()
    bootstrap()
  })

  // A token pasted as the page URL is consumed once and removed from the address
  // bar; it never goes into a log or a referrer.
  if (readTokenFromUrl()) {
    hideGate()
    bootstrap()
  } else {
    const stored = loadStoredToken()
    if (stored) {
      STATE.token = stored
      hideGate()
      bootstrap()
    } else {
      setMode('loading', null)
      setConn('warn', '需要 token')
      showGate('')
    }
  }

  setInterval(() => {
    if (STATE.mode === 'chat' && !STATE.sessionId && !STATE.router) bootstrap()
  }, 15_000)
})()
</script>
</body>
</html>
