  const TERMINAL_STATUSES = new Set(['completed', 'failed', 'cancelled', 'interrupted', 'blocked'])

  function isTerminal(status) {
    return TERMINAL_STATUSES.has(status)
  }

  function laneStatusText(run) {
    if (STATE.cancelRequested.has(run.id) && !isTerminal(run.status)) return '停止中'
    if (run.status === 'queued') return '排队'
    if (run.status === 'completed') return '完成'
    if (isTerminal(run.status)) return run.status === 'cancelled' ? '已取消' : '失败'
    return '进行中'
  }

  function formatDuration(ms) {
    if (!Number.isFinite(ms) || ms < 0) return ''
    const seconds = Math.max(1, Math.round(ms / 1000))
    if (seconds < 60) return `${seconds} 秒`
    const minutes = Math.round(seconds / 60)
    if (minutes < 60) return `${minutes} 分钟`
    return `${(minutes / 60).toFixed(1)} 小时`
  }

  /** Per-lane clock, fine-grained enough to visibly tick. */
  function formatClock(ms) {
    if (!Number.isFinite(ms) || ms < 0) return ''
    const total = Math.floor(ms / 1000)
    const minutes = Math.floor(total / 60)
    const seconds = total % 60
    return minutes > 0 ? `${minutes}分${String(seconds).padStart(2, '0')}秒` : `${seconds}秒`
  }

  function laneElapsed(run) {
    const start = Date.parse(run.createdAt)
    const end = isTerminal(run.status) ? Date.parse(run.finishedAt) : Date.now()
    if (!Number.isFinite(start) || !Number.isFinite(end)) return ''
    return formatClock(end - start)
  }

  function tickLaneClocks() {
    for (const node of messagesEl.querySelectorAll('.lane-time')) {
      const started = Number(node.dataset.started)
      if (!Number.isFinite(started) || node.dataset.started === '') continue
      const finished = node.dataset.finished ? Number(node.dataset.finished) : Date.now()
      if (!Number.isFinite(finished)) continue
      node.textContent = formatClock(finished - started)
    }
  }

  // ---------- schedule rail ----------
  //
  // The right-hand rail is a projection of what the host already writes: its
  // own conversation list plus the run records on disk (status, each step's
  // startedAt/finishedAt/waitingOn, the run's maxParallel and queue). Nothing
  // here invents a second queue or recomputes progress.

  function timeOf(value) {
    const ms = typeof value === 'number' ? value : Date.parse(value)
    return Number.isFinite(ms) ? ms : null
  }

  /** The live session reads STATE.runs; every other card reads the host list. */
  function railRows(session) {
    const rows = session.sessionId === STATE.sessionId && STATE.runs.length > 0
      ? STATE.runs
      : Array.isArray(session.rows) ? session.rows : []
    return rows.slice(0, 8)
  }

  function railApprovals(sessionId) {
    if (sessionId !== STATE.sessionId) return 0
    let count = 0
    for (const entry of STATE.approvals.values()) if (!entry.decided) count += 1
    return count
  }

  function railFactsOf(session) {
    const rows = railRows(session)
    const steps = rows.flatMap(run => (Array.isArray(run.subtasks) ? run.subtasks : []))
    const active = rows.filter(run => !isTerminal(run.status) && run.status !== 'queued')
    const queued = rows.filter(run => run.status === 'queued')
    const running = steps.filter(step => step.status === 'running')
    const waiting = steps.filter(step => step.status === 'waiting')
    const cap = rows.reduce((best, run) => Math.max(best, Number(run.limits?.maxParallel) || 0), 0)
    const attention = rows.reduce((sum, run) => sum + (Array.isArray(run.attention) ? run.attention.length : 0), 0)
    const approvals = railApprovals(session.sessionId)
    const latest = rows.reduce((best, run) => {
      const at = timeOf(run.createdAt) ?? 0
      return at > best.at ? { at, run } : best
    }, { at: -1, run: null }).run
    return { rows, steps, active, queued, running, waiting, cap, attention, approvals, latest }
  }

  /** Card state, in the order a person would want to know about it. */
  function railStatusOf(session, facts) {
    if (facts.approvals > 0) return { kind: 'approval', text: '等审批', dot: 'approval' }
    if (facts.attention > 0) return { kind: 'attention', text: '等你决定', dot: 'attention' }
    if (facts.active.length > 0) return { kind: 'running', text: '在跑', dot: 'running' }
    if (facts.queued.length > 0) return { kind: 'queued', text: '排队', dot: '' }
    if (session.running === true && facts.rows.length === 0) return { kind: 'running', text: '在跑', dot: 'running' }
    const latest = facts.latest
    if (latest) {
      if (latest.status === 'completed') return { kind: 'done', text: '完成', dot: 'done' }
      if (latest.status === 'cancelled') return { kind: 'failed', text: '已取消', dot: 'failed' }
      if (isTerminal(latest.status)) return { kind: 'failed', text: '失败', dot: 'failed' }
    }
    return { kind: 'idle', text: '空闲', dot: '' }
  }

  function railTitleOf(session) {
    if (typeof session.title === 'string' && session.title) return session.title
    if (typeof session.first === 'string' && session.first) return session.first
    if (session.sessionId === STATE.sessionId) return '当前会话'
    const rows = Array.isArray(session.rows) ? session.rows : []
    if (session.blank && rows.length === 0) return '空会话'
    return shortId(session.sessionId) || '会话'
  }

  function railFactsLine(facts) {
    const parts = [`${facts.rows.length} 条任务线`]
    if (facts.running.length > 0) parts.push(`并行 ${facts.running.length}${facts.cap > 0 ? `/${facts.cap}` : ''}`)
    if (facts.waiting.length > 0) parts.push(`等前一步 ${facts.waiting.length}`)
    if (facts.queued.length > 0) parts.push(`排队 ${facts.queued.length}`)
    return parts.join(' · ')
  }

  /** One short sentence about the thing that needs attention right now. */
  function railNowOf(session, facts, status) {
    if (status.kind === 'approval') return `有 ${facts.approvals} 个工具调用等你批`
    if (status.kind === 'attention') return `有 ${facts.attention} 个问题等你回`
    if (facts.active.length > 0) {
      const tools = [...new Set(facts.active.flatMap(run => runningToolsOf(run)))]
      if (tools.length > 0) return `工具 ${tools.slice(0, 2).join('、')}`
      const step = facts.active[0].subtasks?.find(item => item.status === 'running')
      return step ? stepLabel(step) : currentAction(facts.active[0])
    }
    const queued = facts.queued[0]
    if (queued) {
      const queue = queued.queue || {}
      return queue.position ? `排第 ${queue.position}${queue.of ? ` / ${queue.of}` : ''}` : '排队，等前面的跑完'
    }
    if (facts.rows.length === 0) return session.running ? '这一轮刚开始' : '还没有任务线'
    if (status.kind === 'done') return '这一轮已结束'
    if (status.kind === 'failed') return '没走通，点开看步骤'
    return '没有在跑的'
  }

  function stepTitleOf(run, key) {
    const hit = (Array.isArray(run.subtasks) ? run.subtasks : []).find(subtask => subtask.key === key)
    return hit ? stepLabel(hit) : String(key)
  }

  function stepDuration(step) {
    const start = timeOf(step.startedAt)
    if (start === null) return ''
    const end = timeOf(step.finishedAt) ?? (step.status === 'running' ? Date.now() : null)
    if (end === null) return ''
    return formatClock(end - start)
  }

  function railClock(run) {
    const node = el('span', 'rail-elapsed', laneElapsed(run))
    const start = timeOf(run.createdAt)
    if (start !== null) node.dataset.start = String(start)
    const finish = timeOf(run.finishedAt)
    if (finish !== null) node.dataset.finish = String(finish)
    return node
  }

  function railStep(run, step) {
    const row = el('div', `step ${step.status || 'pending'}`)
    row.append(el('span', 'sdot'))
    const text = el('span', 'rail-step-text', stepLabel(step))
    const notes = []
    if (step.status === 'running' && step.tool) notes.push(`工具 ${step.tool}`)
    const waits = Array.isArray(step.waitingOn) ? step.waitingOn : []
    if (waits.length > 0) notes.push(`等「${waits.map(key => stepTitleOf(run, key)).join('」「')}」`)
    else if (step.status === 'waiting') notes.push('等前一步')
    if (step.status === 'skipped') notes.push('跳过')
    if (notes.length > 0) text.append(el('span', 'rail-step-note', ` · ${notes.join(' · ')}`))
    row.append(text)
    const duration = stepDuration(step)
    if (duration) row.append(el('span', 'rail-step-dur', duration))
    return row
  }

  function railRun(run) {
    const box = el('div', 'rail-run')
    const head = el('div', 'rail-run-head')
    head.append(el('span', `status-pill ${statusClass(run.status)}`, laneStatusText(run)))
    const goal = el('span', 'rail-run-goal', run.goal || '这条任务线')
    goal.title = run.goal || ''
    head.append(goal)
    head.append(railClock(run))
    box.append(head)

    const steps = Array.isArray(run.subtasks) ? run.subtasks : []
    if (steps.length === 0) {
      box.append(el('p', 'rail-note', run.status === 'queued'
        ? '等前面的任务线跑完再开始'
        : run.status === 'planning' ? '拆步骤中，还没有步骤时间' : '还没有步骤记录'))
      return box
    }
    const queue = run.queue || {}
    if (run.status === 'queued' && queue.position) {
      box.append(el('p', 'rail-note', `排队第 ${queue.position}${queue.of ? ` / ${queue.of}` : ''}`))
    }
    const list = el('div', 'rail-steps')
    for (const step of steps.slice(0, 12)) list.append(railStep(run, step))
    if (steps.length > 12) list.append(el('p', 'rail-note', `还有 ${steps.length - 12} 个步骤`))
    box.append(list)
    return box
  }

  function railDetailBody(session) {
    const facts = railFactsOf(session)
    const status = railStatusOf(session, facts)
    const wrap = el('div', 'rail-detail')
    const back = el('button', 'rail-back', '← 全部会话')
    back.type = 'button'
    back.addEventListener('click', () => {
      STATE.railDetail = null
      renderRail()
    })
    wrap.append(back)

    const head = el('div', 'rail-detail-head')
    head.append(el('div', 'rail-detail-title', railTitleOf(session)))
    head.append(el('div', 'rail-detail-facts', [
      status.text, railFactsLine(facts), `更新 ${timeLabel(session.updatedAt) || '—'}`,
    ].join(' · ')))
    wrap.append(head)

    if (facts.rows.length === 0) {
      wrap.append(el('p', 'rail-empty', session.running
        ? '这一轮刚开始，还没有任务线记录。'
        : '这个会话还没有任务线。'))
      return wrap
    }
    for (const run of [...facts.rows].reverse()) wrap.append(railRun(run))
    return wrap
  }

  function railCard(session) {
    const facts = railFactsOf(session)
    const status = railStatusOf(session, facts)
    const card = el('button', `rail-card k-${status.kind}${session.sessionId === STATE.sessionId ? ' current' : ''}`)
    card.type = 'button'

    const top = el('div', 'rail-card-top')
    top.append(el('span', `rail-dot ${status.dot}`.trim()))
    top.append(el('span', 'rail-state', status.text))
    top.append(el('span', 'rail-when', timeLabel(session.updatedAt) || '—'))
    card.append(top)

    const title = el('div', 'rail-title', railTitleOf(session))
    title.title = title.textContent
    card.append(title)

    card.append(el('div', `rail-now${status.kind === 'idle' || status.kind === 'done' ? ' idle' : ''}`,
      railNowOf(session, facts, status)))

    const meta = el('div', 'rail-meta')
    meta.append(el('span', '', `${facts.rows.length} 条`))
    meta.append(el('span', '', `并行 ${facts.running.length}`))
    if (facts.queued.length > 0) meta.append(el('span', '', `排队 ${facts.queued.length}`))
    card.append(meta)

    card.addEventListener('click', () => {
      STATE.railDetail = session.sessionId
      renderRail()
    })
    return card
  }

  function railSignature() {
    const rows = STATE.schedules.map(session => {
      const facts = railFactsOf(session)
      return [
        session.sessionId,
        session.updatedAt ?? '',
        session.running ? 'on' : '',
        session.title || session.first || '',
        facts.approvals,
        facts.attention,
        facts.rows.map(run => `${run.id}:${laneSignature(run)}`).join(','),
      ].join(':')
    })
    return [STATE.railDetail || '', STATE.schedulesNote || '', rows.join('|')].join('#')
  }

  function renderRail() {
    const sessions = STATE.schedules
    const detail = sessions.find(session => session.sessionId === STATE.railDetail)
    if (STATE.railDetail && !detail) STATE.railDetail = null
    let running = 0
    let waiting = 0
    for (const session of sessions) {
      const kind = railStatusOf(session, railFactsOf(session)).kind
      if (kind === 'running' || kind === 'queued') running += 1
      else if (kind === 'attention' || kind === 'approval') waiting += 1
    }
    const busy = running + waiting
    railCountEl.textContent = String(busy)
    railCountEl.hidden = busy === 0
    const headParts = [`${sessions.length} 个会话`]
    if (running > 0) headParts.push(`在跑 ${running}`)
    if (waiting > 0) headParts.push(`等你 ${waiting}`)
    railFactsEl.textContent = sessions.length === 0 ? '' : headParts.join(' · ')

    const signature = railSignature()
    if (signature === STATE.railSig) return
    STATE.railSig = signature

    if (sessions.length === 0) {
      railBodyEl.replaceChildren(el('p', 'rail-empty', STATE.schedulesNote
        ? `读不到会话列表：${STATE.schedulesNote}`
        : STATE.mode === 'chat' ? '读取会话…' : '还不能读取会话。'))
      return
    }
    railBodyEl.replaceChildren(detail ? railDetailBody(detail) : railGridOf(sessions))
  }

  function railGridOf(sessions) {
    const grid = el('div', 'rail-grid')
    for (const session of sessions) grid.append(railCard(session))
    return grid
  }

  /** Elapsed clocks inside the open card detail keep ticking between polls. */
  function tickRailClocks() {
    for (const node of railBodyEl.querySelectorAll('.rail-elapsed[data-start]')) {
      const started = Number(node.dataset.start)
      if (!Number.isFinite(started)) continue
      const finished = node.dataset.finish ? Number(node.dataset.finish) : Date.now()
      if (!Number.isFinite(finished)) continue
      node.textContent = formatClock(finished - started)
    }
  }

  let railTimer = 0
  function queueRail() {
    if (railTimer) return
    railTimer = setTimeout(() => {
      railTimer = 0
      renderRail()
    }, 120)
  }

  function setRail(collapsed, { persist = true } = {}) {
    document.body.classList.toggle('rail-collapsed', collapsed)
    document.body.classList.toggle('rail-open', !collapsed)
    railToggleEl.textContent = collapsed ? '‹' : '›'
    railToggleEl.setAttribute('aria-label', collapsed ? '展开调度' : '收起调度')
    railToggleEl.title = collapsed ? '展开调度' : '收起调度'
    if (persist) {
      try { localStorage.setItem(RAIL_KEY, collapsed ? '1' : '0') } catch {}
    }
  }

  /** A stored choice wins; otherwise a narrow screen starts collapsed. */
  function restoreRail() {
    let stored = null
    try { stored = localStorage.getItem(RAIL_KEY) } catch {}
    if (stored === '1' || stored === '0') setRail(stored === '1', { persist: false })
    else setRail(window.innerWidth <= 720, { persist: false })
  }

  async function loadSchedules() {
    if (STATE.schedulesBusy || !STATE.token) return
    STATE.schedulesBusy = true
    try {
      const data = await api('/api/console/schedules')
      STATE.schedules = Array.isArray(data?.sessions) ? data.sessions : []
      STATE.schedulesNote = data?.reason || null
    } catch (error) {
      STATE.schedulesNote = messageOf(error)
    } finally {
      STATE.schedulesBusy = false
      renderRail()
    }
  }

  function syncStopAll() {
    const active = STATE.runs.filter(run => !isTerminal(run.status))
    stopAllEl.hidden = active.length === 0
    stopAllEl.disabled = STATE.mode !== 'chat' || active.length === 0 || STATE.stopAllBusy
    stopAllEl.textContent = STATE.stopAllBusy ? '停止中…' : '停止这一轮'
  }

  async function stopRun(runId) {
    if (!runId || STATE.cancelRequested.has(runId)) return
    STATE.cancelRequested.add(runId)
    renderLanes()
    try {
      await api(`/api/console/runs/${encodeURIComponent(runId)}/cancel`, { method: 'POST' })
      pushToast('已请求停止，等宿主确认。', 'ok')
    } catch (error) {
      STATE.cancelRequested.delete(runId)
      renderLanes()
      pushToast(`无法停止这条任务线：${messageOf(error)}`, 'err')
    }
  }

  async function stopAllRuns() {
    const active = STATE.runs.filter(run => !isTerminal(run.status) && !STATE.cancelRequested.has(run.id))
    if (active.length === 0) return
    STATE.stopAllBusy = true
    syncStopAll()
    for (const run of active) STATE.cancelRequested.add(run.id)
    renderLanes()
    for (const run of active) {
      try {
        await api(`/api/console/runs/${encodeURIComponent(run.id)}/cancel`, { method: 'POST' })
      } catch (error) {
        STATE.cancelRequested.delete(run.id)
        pushToast(`有任务线没停下来：${messageOf(error)}`, 'err')
      }
    }
    STATE.stopAllBusy = false
    renderLanes()
    syncStopAll()
    pushToast('已请求停止这一轮。', 'ok')
  }

  function stepLabel(subtask) {
    return subtask.title || `步骤 ${subtask.index ?? ''}`.trim()
  }

  function currentAction(run) {
    const subtasks = Array.isArray(run.subtasks) ? run.subtasks : []
    if (STATE.cancelRequested.has(run.id) && !isTerminal(run.status)) return '已请求停止，等宿主确认'
    if (run.status === 'queued') return '排队，等前面的任务线跑完'
    if (run.status === 'planning') return '拆分步骤中'
    if (run.status === 'aggregating') return '汇总各步骤的结果'
    if (run.status === 'completed') return '已交付，产物见汇总'
    if (isTerminal(run.status)) return run.status === 'cancelled' ? '已取消' : '没走通，原因见汇总'
    const running = subtasks.filter(subtask => subtask.status === 'running')
    if (running.length > 1) return `同时推进 ${running.length} 个步骤`
    if (running.length === 1) return `正在做 ${stepLabel(running[0])}`
    const next = subtasks.find(subtask => subtask.status !== 'completed' && subtask.status !== 'failed')
    if (next) return `接下来 ${stepLabel(next)}`
    return '进行中'
  }

  /** Tools the running steps report right now; empty when unknown, never guessed. */
  function runningToolsOf(run) {
    const subtasks = Array.isArray(run.subtasks) ? run.subtasks : []
    return [...new Set(subtasks
      .filter(subtask => subtask.status === 'running' && typeof subtask.tool === 'string' && subtask.tool)
      .map(subtask => subtask.tool))]
  }

  function laneSignature(run) {
    const steps = Array.isArray(run.subtasks)
      ? run.subtasks.map(subtask => [
        subtask.status, subtask.key || '', subtask.title, subtask.tool || '',
        subtask.startedAt || '', subtask.finishedAt || '',
        (subtask.waitingOn || []).join('.'), (subtask.dependsOn || []).join('.'),
      ].join(':')).join(',')
      : ''
    const attention = Array.isArray(run.attention)
      ? run.attention.map(item => `${item.id}:${item.question}`).join(',')
      : ''
    return [
      run.status, steps, attention, run.report ? run.report.length : 0, run.finishedAt || '',
      STATE.cancelRequested.has(run.id) ? 'stopping' : '',
      run.limits?.maxParallel ?? '', run.queue?.position ?? '', run.queue?.waiting ? 'queued' : '',
    ].join('|')
  }

  /**
   * Files and pages a run report names. They are the only things offered as
   * "open me", and the artifact route re-checks the same report before serving
   * one, so a link can never reach a path the agent did not already report.
   */
  function artifactsOf(run) {
    const text = typeof run.report === 'string' ? run.report : ''
    if (!text) return []
    const items = []
    const seen = new Set()
    const push = value => {
      const href = value.replace(/[.,;:，。；：]+$/, '')
      if (!href || seen.has(href)) return
      seen.add(href)
      items.push({ href, runId: run.id })
    }
    for (const match of text.matchAll(/https?:\/\/[^\s"'`<>)\]}|]+/g)) push(match[0])
    for (const match of text.matchAll(/(?:[A-Za-z]:[\\/]|\.{1,2}[\\/]|~[\\/])[^\s"'`<>|]+?\.(?:html?|md|pdf|docx?|xlsx?|csv|tsv|json|ya?ml|txt|log|png|jpe?g|gif|webp|svg|zip|pptx?|py|js|mjs|css)\b/gi)) {
      push(match[0])
    }
    return items.slice(0, 12)
  }

  function artifactName(item) {
    return item.href.replace(/[\\/]+$/, '').split(/[\\/]/).pop() || item.href
  }

  function artifactUrl(item) {
    if (/^https?:\/\//i.test(item.href)) return item.href
    return `/api/console/artifact?path=${encodeURIComponent(item.href)}&runId=${encodeURIComponent(item.runId)}&token=${encodeURIComponent(STATE.token)}`
  }

  function artifactElement(item) {
    const isUrl = /^https?:\/\//i.test(item.href)
    const button = el('button', 'artifact')
    button.type = 'button'
    button.title = item.href
    button.append(el('span', 'ak', isUrl ? '页面' : '文件'))
    button.append(el('span', 'an', artifactName(item)))
    button.addEventListener('click', () => previewArtifact(item))
    return button
  }

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
    ))
  }

  /** Inline spans a report actually uses: code, bold, http links. */
  function inlineMarkdown(text) {
    return escapeHtml(text)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  }

  /**
   * Minimal Markdown for run reports: headings, lists, fenced code, paragraphs.
   * Everything is escaped before markup is added, so a report cannot inject HTML.
   */
  function renderMarkdownInto(container, text) {
    container.textContent = ''
    const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n')
    let list = null
    let listTag = ''
    let buffer = []
    const closeList = () => { list = null; listTag = '' }
    const flushParagraph = () => {
      if (buffer.length === 0) return
      const para = el('p')
      para.innerHTML = inlineMarkdown(buffer.join('\n')).replace(/\n/g, '<br>')
      container.append(para)
      buffer = []
    }
    for (let i = 0; i < lines.length; i += 1) {
      const line = lines[i]
      const fence = line.match(/^\s*```(\S*)\s*$/)
      if (fence) {
        flushParagraph()
        closeList()
        const code = []
        i += 1
        while (i < lines.length && !/^\s*```\s*$/.test(lines[i])) {
          code.push(lines[i])
          i += 1
        }
        const pre = el('pre')
        pre.append(el('code', '', code.join('\n')))
        container.append(pre)
        continue
      }
      if (!line.trim()) {
        flushParagraph()
        closeList()
        continue
      }
      if (/^\s*(?:---+|\*\*\*+)\s*$/.test(line)) {
        flushParagraph()
        closeList()
        container.append(el('hr'))
        continue
      }
      const heading = line.match(/^(#{1,4})\s+(.*)$/)
      if (heading) {
        flushParagraph()
        closeList()
        const node = el(`h${heading[1].length}`)
        node.innerHTML = inlineMarkdown(heading[2])
        container.append(node)
        continue
      }
      const bullet = line.match(/^\s*[-*+]\s+(.*)$/)
      const ordered = line.match(/^\s*\d+[.)]\s+(.*)$/)
      if (bullet || ordered) {
        flushParagraph()
        const tag = bullet ? 'ul' : 'ol'
        if (!list || listTag !== tag) {
          list = el(tag)
          listTag = tag
          container.append(list)
        }
        const item = el('li')
        item.innerHTML = inlineMarkdown((bullet || ordered)[1])
        list.append(item)
        continue
      }
      buffer.push(line)
    }
    flushParagraph()
    closeList()
  }

  function previewFrame(src) {
    const frame = el('iframe')
    frame.setAttribute('sandbox', 'allow-scripts allow-popups allow-forms')
    frame.setAttribute('referrerpolicy', 'no-referrer')
    frame.src = src
    return frame
  }

  function setDialogActions(nodes) {
    dialogActionsEl.textContent = ''
    const items = Array.isArray(nodes) ? nodes : []
    for (const node of items) dialogActionsEl.append(node)
    dialogActionsEl.hidden = items.length === 0
  }

  function externalArtifactLink(item) {
    const link = el('a', 'btn', '新标签打开')
    link.href = artifactUrl(item)
    link.target = '_blank'
    link.rel = 'noopener'
    return link
  }

  /**
   * Show an artifact in place. Markdown is rendered, HTML runs in a sandboxed
   * frame (the route already ships a sandbox CSP), images and PDFs render
   * natively, and anything else falls back to its text. The original file stays
   * one click away from the dialog footer.
   */
  async function previewArtifact(item) {
    const isUrl = /^https?:\/\//i.test(item.href)
    const name = artifactName(item)
    const ext = (name.split('.').pop() || '').toLowerCase()
    dialogTitleEl.textContent = name
    dialogMetaEl.textContent = ''
    dialogMetaEl.append(el('span', '', isUrl ? item.href : `产物 · ${item.href}`))
    dialogReportEl.textContent = ''
    setDialogActions([externalArtifactLink(item)])
    const url = artifactUrl(item)
    if (isUrl) {
      dialogReportEl.append(previewFrame(url))
      reportDialogEl.showModal()
      return
    }
    if (ext === 'html' || ext === 'htm') {
      dialogReportEl.append(previewFrame(url))
      reportDialogEl.showModal()
      return
    }
    if (['png', 'jpg', 'jpeg', 'gif', 'webp', 'svg'].includes(ext)) {
      const image = el('img', 'image-preview')
      image.src = url
      image.alt = name
      dialogReportEl.append(image)
      reportDialogEl.showModal()
      return
    }
    if (ext === 'pdf') {
      dialogReportEl.append(previewFrame(url))
      reportDialogEl.showModal()
      return
    }
    const loading = el('p', '', '正在读取…')
    dialogReportEl.append(loading)
    reportDialogEl.showModal()
    let text = ''
    try {
      const response = await fetch(url)
      if (!response.ok) {
        throw new Error(response.status === 415
          ? '这个类型不能在控制台里预览'
          : `读取失败（HTTP ${response.status}）`)
      }
      text = await response.text()
    } catch (error) {
      dialogReportEl.textContent = `读取失败：${messageOf(error)}`
      return
    }
    dialogReportEl.textContent = ''
    if (ext === 'md' || ext === 'markdown') renderMarkdownInto(dialogReportEl, text)
    else {
      const pre = el('pre')
      pre.append(el('code', '', text))
      dialogReportEl.append(pre)
    }
  }

  function resetLanes() {
    STATE.laneEls.clear()
    STATE.runAnchors.clear()
    STATE.attentionSeen.clear()
  }

  function anchorForRun(run) {
    const at = Date.parse(run.createdAt || '')
    const limit = Number.isFinite(at) ? at : Date.now()
    for (let i = STATE.messages.length - 1; i >= 0; i -= 1) {
      const message = STATE.messages[i]
      if (message.role === 'user' && message.at <= limit + 2000) return message.id
    }
    return ''
  }

  function renderLanes() {
    const active = document.activeElement
    const activeKey = active && active.dataset ? active.dataset.draftKey : null
    const groups = new Map()
    for (const run of STATE.runs) {
      let key = STATE.runAnchors.get(run.id)
      if (key === undefined) {
        key = anchorForRun(run)
        STATE.runAnchors.set(run.id, key)
      }
      if (!groups.has(key)) groups.set(key, [])
      groups.get(key).push(run)
    }
    for (const [key, runs] of groups) {
      const anchor = key ? STATE.messages.find(message => message.id === key) : null
      let node = STATE.laneEls.get(key)
      if (!node) {
        node = el('div', 'lane-group')
        STATE.laneEls.set(key, node)
        if (anchor && anchor.el && anchor.el.parentNode === messagesEl) {
          anchor.el.after(node)
        } else {
          removeEmpty()
          messagesEl.append(node)
        }
      }
      const signature = runs.map(run => `${run.id}:${laneSignature(run)}`).join('#')
      if (node.dataset.sig === signature) continue
      node.dataset.sig = signature
      node.replaceChildren()
      const done = runs.every(run => isTerminal(run.status))
      const head = el('div', `lane-group-head${done ? ' done' : ''}`)
      head.append(el('span', 'dot'))
      head.append(el('span', '', done ? `这一轮完成 · ${runs.length} 条任务线` : `进行中 · ${runs.length} 条任务线`))
      node.append(head)
      for (const run of runs) node.append(laneElement(run))
      if (done) node.append(summaryElement(runs))
    }
    const openAttention = STATE.runs.flatMap(run => (Array.isArray(run.attention) ? run.attention : [])
      .map(item => ({ run, item, key: `${run.id}:${item.id}` })))
    const fresh = openAttention.filter(entry => !STATE.attentionSeen.has(entry.key))
    for (const entry of openAttention) STATE.attentionSeen.add(entry.key)
    if (fresh.length > 0) {
      STATE.autoScroll = true
      pushToast('有一条任务线在等你决定。')
      const card = messagesEl.querySelector('.attention-card')
      if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
    }
    scrollToEnd()
    if (activeKey) {
      const next = document.querySelector(`[data-draft-key="${cssEscape(activeKey)}"]`)
      if (next) {
        next.focus()
        try { next.setSelectionRange(next.value.length, next.value.length) } catch {}
      }
    }
    renderAdvancedRuns()
    for (const id of [...STATE.cancelRequested]) {
      const run = STATE.runs.find(item => item.id === id)
      if (!run || isTerminal(run.status)) STATE.cancelRequested.delete(id)
    }
    syncStopAll()
    queueRail()
    renderHistory()
  }

  async function loadSessions() {
    if (STATE.sessionsBusy) return
    STATE.sessionsBusy = true
    renderHistory()
    try {
      const data = await api('/api/console/sessions')
      STATE.sessions = Array.isArray(data.sessions) ? data.sessions : []
      STATE.sessionsLoadedAt = Date.now()
      STATE.sessionNote = data.reason || null
    } catch (error) {
      STATE.sessions = []
      STATE.sessionNote = messageOf(error)
    } finally {
      STATE.sessionsBusy = false
      renderHistory()
    }
  }

  /**
   * Reopen a conversation the host already has. The page reloads so the normal
   * bootstrap/follow path rebuilds the thread, cards and artifacts — the same
   * code that serves a fresh page load, not a second renderer.
   */
  async function switchToSession(sessionId) {
    if (!sessionId || sessionId === STATE.sessionId) {
      drawerClose()
      return
    }
    try {
      await api('/api/console/session/switch', { method: 'POST', body: { sessionId } })
      window.location.reload()
    } catch (error) {
      pushToast(`无法打开那条对话：${messageOf(error)}`, 'err')
    }
  }

  function renderHistory() {
    if (historyDrawerEl.hidden) return
    historyListEl.replaceChildren()
    if (STATE.sessionsBusy && STATE.sessions.length === 0) {
      historyListEl.append(el('p', 'adv-note', '读取中…'))
      return
    }
    if (STATE.sessionNote) {
      historyListEl.append(el('p', 'adv-note', `无法读取历史：${STATE.sessionNote}`))
    }
    if (STATE.sessions.length === 0) {
      historyListEl.append(el('p', 'adv-note', '还没有可回看的对话。'))
      return
    }
    for (const session of STATE.sessions) {
      const current = session.sessionId === STATE.sessionId
      const item = el('div', `hist-item${current ? ' current' : ''}`)
      const top = el('div', 'hist-top')
      const when = session.updatedAt ? timeLabel(new Date(session.updatedAt).toISOString()) : '时间未知'
      top.append(el('span', '', when))
      if (current) top.append(el('span', 'hist-state', '当前'))
      else if (session.running) top.append(el('span', 'hist-state', '进行中'))
      if (session.runs > 0) top.append(el('span', 'hist-state', `${session.runs} 轮 · ${session.artifacts} 个产物`))
      item.append(top)
      item.append(el('div', 'hist-text', session.first || session.title || '（这条对话还没有内容）'))
      item.addEventListener('click', () => switchToSession(session.sessionId))
      historyListEl.append(item)
    }
  }

  function advRow(label, value) {
    const row = el('div', 'adv-row')
    row.append(el('span', 'adv-label', label))
    row.append(el('code', '', value))
    return row
  }

  function renderAdvancedRuns() {
    if (advancedDrawerEl.hidden) return
    advSessionEl.replaceChildren()
    advSessionEl.append(advRow('会话', STATE.sessionId ? shortId(STATE.sessionId) : '未建立'))
    advSessionEl.append(advRow('预置', STATE.preset || '默认'))
    advRunsEl.replaceChildren()
    if (STATE.runs.length === 0) {
      advRunsEl.append(el('p', 'adv-note', '还没有任务线。'))
      return
    }
    for (const run of STATE.runs) {
      const row = el('div', 'adv-run')
      row.append(el('div', 't', run.goal || '任务线'))
      row.append(el('div', 'm', run.id))
      row.append(el('div', 'm', [
        statusText(run.status),
        run.usage ? `${formatTokens(run.usage.totalTokens)} tokens` : null,
        run.cost?.text ?? null,
        `${Array.isArray(run.subtasks) ? run.subtasks.length : 0} 个步骤`,
      ].filter(Boolean).join(' · ')))
      const view = el('button', 'btn tiny', '查看完整报告')
      view.type = 'button'
      view.addEventListener('click', () => openReport(run.id))
      row.append(view)
      advRunsEl.append(row)
    }
  }


  function cssEscape(value) {
    if (window.CSS && typeof window.CSS.escape === 'function') return window.CSS.escape(value)
    return String(value).replace(/["\\]/g, '\\$&')
  }

  function laneElement(run) {
    const card = el('div', `lane ${statusClass(run.status)}`)
    card.dataset.runId = run.id

    const head = el('div', 'lane-head')
    const title = el('div', 'lane-title')
    title.append(el('div', 'lane-goal', run.goal || '这条任务线'))
    const action = currentAction(run)
    if (action) {
      const line = el('div', 'lane-now')
      if (!isTerminal(run.status) && !STATE.cancelRequested.has(run.id)) line.append(el('span', 'spark'))
      line.append(el('span', '', action))
      const tools = runningToolsOf(run)
      if (tools.length > 0) line.append(el('span', 'lane-tool', ` · 工具 ${tools.join('、')}`))
      title.append(line)
    }
    head.append(title)
    const clock = el('span', 'lane-time', laneElapsed(run))
    clock.dataset.started = Number.isFinite(Date.parse(run.createdAt)) ? String(Date.parse(run.createdAt)) : ''
    clock.dataset.finished = isTerminal(run.status) && Number.isFinite(Date.parse(run.finishedAt))
      ? String(Date.parse(run.finishedAt))
      : ''
    if (!clock.textContent) clock.hidden = true
    head.append(clock)
    if (!isTerminal(run.status)) {
      const stopping = STATE.cancelRequested.has(run.id)
      const stop = el('button', `lane-stop${stopping ? ' stopping' : ''}`, stopping ? '停止中…' : '停止')
      stop.type = 'button'
      stop.disabled = stopping
      stop.addEventListener('click', event => {
        event.stopPropagation()
        stopRun(run.id)
      })
      head.append(stop)
    }
    head.append(el('span', `status-pill ${statusClass(run.status)}`, laneStatusText(run)))
    card.append(head)

    const subtasks = Array.isArray(run.subtasks) ? run.subtasks : []
    if (subtasks.length > 0) {
      const steps = el('div', 'steps')
      for (const subtask of subtasks.slice(0, 8)) {
        const row = el('div', `step ${subtask.status || ''}`.trim())
        row.append(el('span', 'sdot'))
        row.append(el('span', '', stepLabel(subtask)))
        steps.append(row)
      }
      if (subtasks.length > 8) {
        const row = el('div', 'step')
        row.append(el('span', 'sdot'))
        row.append(el('span', '', `还有 ${subtasks.length - 8} 个步骤`))
        steps.append(row)
      }
      card.append(steps)

      const done = subtasks.filter(subtask => subtask.status === 'completed').length
      const bar = el('div', 'progress')
      const fill = el('i')
      fill.style.width = `${Math.round((done / subtasks.length) * 100)}%`
      bar.append(fill)
      card.append(bar)
      card.append(el('div', 'lane-progress-text', `${done}/${subtasks.length} 步骤完成`))
    }

    if (Array.isArray(run.attention)) {
      for (const item of run.attention) card.append(attentionElement(run, item))
    }

    return card
  }

  function summaryElement(runs) {
    const failed = runs.filter(run => isTerminal(run.status) && run.status !== 'completed')
    const box = el('div', `summary${failed.length > 0 ? ' bad' : ''}`)
    box.append(el('div', 'st', failed.length > 0
      ? `完成 · ${failed.length} 条任务线失败`
      : `全部完成 · ${runs.length} 条任务线`))

    const first = runs.map(run => Date.parse(run.createdAt)).filter(Number.isFinite).sort((a, b) => a - b)[0]
    const last = runs.map(run => Date.parse(run.finishedAt)).filter(Number.isFinite).sort((a, b) => b - a)[0]
    const facts = []
    if (Number.isFinite(first) && Number.isFinite(last)) facts.push(`用时 ${formatDuration(last - first)}`)
    if (failed.length > 0) facts.push(failed.map(run => run.goal || '一条任务线').join('、'))
    if (facts.length > 0) box.append(el('div', 'sd', facts.join(' · ')))

    const artifacts = []
    const seen = new Set()
    for (const run of runs) {
      for (const item of artifactsOf(run)) {
        if (seen.has(item.href)) continue
        seen.add(item.href)
        artifacts.push(item)
      }
    }
    if (artifacts.length > 0) {
      const list = el('div', 'artifacts')
      for (const item of artifacts) list.append(artifactElement(item))
      box.append(list)
    } else {
      box.append(el('div', 'sd', '这次没有能点开的产物，完整汇总在下面。'))
    }

    const details = el('details', 'report')
    details.append(el('summary', '', '汇总'))
    for (const run of runs) {
      const block = el('div', 'sum-run')
      block.append(el('div', 'sum-run-title', `${run.goal || '任务线'} · ${laneStatusText(run)}`))
      block.append(el('pre', '', run.report || '（这条任务线没有报告）'))
      details.append(block)
    }
    box.append(details)
    return box
  }

  function draftKey(runId, attentionId) {
    return `${runId}::${attentionId || 'single'}`
  }

  function attentionElement(run, item) {
    const card = el('div', 'attention-card')
    card.append(el('div', 'kicker', '需要你决定'))
    card.append(el('p', '', item.question || '任务在等一个决定'))
    if (item.reason) card.append(el('p', 'reason', item.reason))

    const key = draftKey(run.id, item.id)
    const busy = STATE.busyAnswers.has(key)
    const options = el('div', 'options')
    if (Array.isArray(item.options)) {
      for (const option of item.options) {
        const button = el('button', '', option)
        button.type = 'button'
        button.disabled = busy
        button.addEventListener('click', () => submitAnswer(run.id, item.id, option, key))
        options.append(button)
      }
    }
    if (options.childElementCount > 0) card.append(options)

    const free = el('div', 'free')
    const field = el('input')
    field.type = 'text'
    field.placeholder = '或输入自己的决定'
    field.dataset.draftKey = key
    field.value = STATE.drafts.get(key) || ''
    field.disabled = busy
    field.addEventListener('input', () => {
      STATE.drafts.set(key, field.value)
    })
    field.addEventListener('keydown', event => {
      if (event.key === 'Enter' && !event.isComposing) {
        event.preventDefault()
        const value = field.value.trim()
        if (value) submitAnswer(run.id, item.id, value, key)
      }
    })
    const submit = el('button', '', busy ? '提交中' : '提交')
    submit.type = 'button'
    submit.disabled = busy
    submit.addEventListener('click', () => {
      const value = field.value.trim()
      if (value) submitAnswer(run.id, item.id, value, key)
    })
    free.append(field, submit)
    card.append(free)
    return card
  }

  async function submitAnswer(runId, attentionId, answer, key) {
    if (STATE.busyAnswers.has(key)) return
    STATE.busyAnswers.add(key)
    renderLanes()
    try {
      await api('/api/console/answer', {
        method: 'POST',
        body: { sessionId: STATE.sessionId, runId, attentionId, answer },
      })
      STATE.drafts.delete(key)
      pushToast('已提交。任务线会在下一步用上这个决定。', 'ok')
    } catch (error) {
      pushToast(`提交失败：${messageOf(error)}`, 'err')
    } finally {
      STATE.busyAnswers.delete(key)
      renderLanes()
    }
  }

  // ---------- approvals ----------

  /** Best-effort target of the blocked call, so the person sees what would change. */
  function approvalTarget(approval) {
    const candidates = [approval.callArguments]
    const call = approval.callId ? STATE.toolCalls.get(approval.callId) : null
    if (call && call.arguments) candidates.push(call.arguments)
    for (const raw of candidates) {
      if (typeof raw !== 'string' || !raw.trim()) continue
      try {
        const args = JSON.parse(raw)
        const target = args?.path ?? args?.file_path ?? args?.filePath ?? args?.target ?? args?.cwd
        if (typeof target === 'string' && target.trim()) return target.trim()
      } catch {
        // Streamed arguments arrive in pieces; fall back to the asker's wording.
      }
    }
    const match = `${approval.reason || ''}`.match(/[A-Za-z]:[\\/][^\s'"，。)]+|\/(?:[^\s'"，。)/]+\/)*[^\s'"，。)/]+/)
    return match ? match[0] : ''
  }

  /** Name the task line that asked, using the lanes the page already shows. */
  function approvalSource(approval) {
    const agentId = approval.agentId
    if (agentId) {
      for (const run of STATE.runs || []) {
        const lanes = Array.isArray(run.subtasks) ? run.subtasks : []
        const hit = lanes.find(item => item && item.childId === agentId)
        if (hit) return `${run.goal || '任务线'} · ${hit.title || '子任务'}`
      }
    }
    return approval.source || '这条对话'
  }

  /** Raw arguments of the blocked call, from the request or the streamed chip. */
  function approvalArguments(approval) {
    const candidates = [approval.callArguments]
    const call = approval.callId ? STATE.toolCalls.get(approval.callId) : null
    if (call && call.arguments) candidates.push(call.arguments)
    for (const raw of candidates) {
      if (typeof raw !== 'string' || !raw.trim()) continue
      try {
        return { parsed: JSON.parse(raw), text: raw }
      } catch {
        return { parsed: null, text: raw }
      }
    }
    return null
  }

  const CALL_PREVIEW_LIMIT = 4000

  /**
   * Spell out what the blocked call would actually do: a write shows the text
   * it would put on disk, a shell call shows the full command, everything else
   * shows the raw arguments.
   */
  function approvalCallPreview(approval) {
    const args = approvalArguments(approval)
    if (!args) return null
    const parsed = args.parsed && typeof args.parsed === 'object' ? args.parsed : null
    const pick = (...keys) => {
      if (!parsed) return ''
      for (const key of keys) {
        if (typeof parsed[key] === 'string' && parsed[key].trim()) return parsed[key]
      }
      return ''
    }
    const tool = `${approval.toolName || ''}`.toLowerCase()
    const clip = value => (value.length > CALL_PREVIEW_LIMIT
      ? { text: `${value.slice(0, CALL_PREVIEW_LIMIT)}\n…`, note: `共 ${value.length} 字符，这里显示前 ${CALL_PREVIEW_LIMIT} 字符。` }
      : { text: value, note: '' })
    if (/write|edit|patch|apply|create|append/.test(tool)) {
      const body = pick('content', 'contents', 'text', 'new_string', 'newText', 'patch', 'diff')
      if (body) return { label: '要写入的内容', ...clip(body) }
    }
    if (/shell|bash|command|exec|terminal|cmd|powershell|run/.test(tool)) {
      const command = pick('command', 'cmd', 'script', 'input')
        || (typeof args.parsed === 'string' ? args.parsed : '')
      if (command) return { label: '要执行的命令', ...clip(command) }
    }
    return { label: '调用参数', ...clip(args.text) }
  }

  function approvalCard(approval) {
    const card = el('div', 'approval-card')
    card.dataset.approvalId = approval.id
    card.append(el('div', 'kicker', '需要你决定'))
    const what = el('div', 'what')
    what.append(el('span', '', '来源 '), el('b', '', approvalSource(approval)))
    what.append(el('span', '', ' · 工具 '), el('b', '', approval.toolName || 'tool'))
    card.append(what)
    const target = approvalTarget(approval)
    if (target) card.append(el('div', 'where', `要动的位置：${target}`))
    const reason = approval.displayReason?.zh || approval.reason
    card.append(el('p', 'why', reason || '宿主拦住了这次工具调用，需要你决定。'))
    const preview = approvalCallPreview(approval)
    if (preview) {
      const details = el('details', 'call')
      details.append(el('summary', '', preview.label))
      details.append(el('pre', '', preview.text))
      if (preview.note) details.append(el('div', 'note', preview.note))
      card.append(details)
    }
    const expiresAt = Date.parse(approval.expiresAt || '')
    if (Number.isFinite(expiresAt)) {
      const expiry = el('div', 'expiry')
      expiry.dataset.expiresAt = String(expiresAt)
      card.append(expiry)
      updateApprovalClock(expiry)
    }
    card.append(el('div', 'state', '等待你的决定…'))
    const options = el('div', 'options')
    const allow = el('button', 'allow', '允许这一次')
    allow.type = 'button'
    allow.addEventListener('click', () => decideApproval(approval.id, 'allow'))
    const allowTool = el('button', 'allow-tool', `本会话内允许 ${approval.toolName || '这个工具'}`)
    allowTool.type = 'button'
    allowTool.title = '这一轮对话里同一个工具不再逐次询问；换对话或新对话后恢复询问。'
    allowTool.addEventListener('click', () => decideApproval(approval.id, 'allow-tool'))
    const reject = el('button', 'reject', '拒绝')
    reject.type = 'button'
    reject.addEventListener('click', () => decideApproval(approval.id, 'reject'))
    options.append(allow)
    if (!STATE.router) options.append(allowTool)
    options.append(reject)
    card.append(options)
    return card
  }

  /** Keeping the deadline visible beats letting the ask silently expire. */
  function updateApprovalClock(node) {
    const expiresAt = Number(node.dataset.expiresAt)
    if (!Number.isFinite(expiresAt)) return
    const left = expiresAt - Date.now()
    node.classList.toggle('soon', left > 0 && left <= 60_000)
    node.classList.toggle('over', left <= 0)
    if (left <= 0) node.textContent = `已过有效期（${timeLabel(expiresAt)}），宿主按拒绝处理。再发起会重新询问。`
    else node.textContent = `还剩 ${formatClock(left)}（约到 ${timeLabel(expiresAt)}）`
  }

  function updateApprovalClocks() {
    for (const node of messagesEl.querySelectorAll('.approval-card .expiry')) updateApprovalClock(node)
  }

  function settleApprovalNode(entry) {
    if (!entry || !entry.node) return
    entry.node.querySelector('.options')?.remove()
    const state = entry.node.querySelector('.state')
    if (!state) return
    if (entry.decided === 'allow') state.textContent = '已允许这一次。只对这一条调用生效。'
    else if (entry.decided === 'allow-tool') state.textContent = `已允许，本会话内 ${entry.approval?.toolName || '这个工具'} 不再询问；换对话后恢复。`
    else if (entry.decided === 'reject') state.textContent = '已拒绝'
    else if (entry.decided === 'expired') state.textContent = '已过有效期，宿主按拒绝处理'
    else if (entry.decided === 'cancelled') state.textContent = '没有回答，按拒绝处理'
    else state.textContent = '等待你的决定…'
    if (entry.decided) entry.node.querySelector('.expiry')?.remove()
  }

  function seatApproval(approval) {
    if (!approval || !approval.id) return null
    const existing = STATE.approvals.get(approval.id)
    if (existing) {
      if (existing.node && existing.node.parentNode !== messagesEl) messagesEl.append(existing.node)
      return existing
    }
    removeEmpty()
    const entry = { approval, node: approvalCard(approval), decided: null }
    STATE.approvals.set(approval.id, entry)
    const orphan = STATE.laneEls.get('')
    if (orphan && orphan.parentNode === messagesEl) messagesEl.insertBefore(entry.node, orphan)
    else messagesEl.append(entry.node)
    scrollToEnd()
    return entry
  }

  /** Re-seat approvals a snapshot cleared, without losing their decided state. */
  function renderApprovals() {
    for (const entry of STATE.approvals.values()) {
      if (!entry.node || entry.node.parentNode !== messagesEl) {
        entry.node = approvalCard(entry.approval)
        messagesEl.append(entry.node)
      }
      if (entry.decided) settleApprovalNode(entry)
    }
    if (STATE.approvals.size > 0) scrollToEnd()
  }

  async function decideApproval(id, decision) {
    const entry = STATE.approvals.get(id)
    if (!entry || entry.decided) return
    const state = entry.node.querySelector('.state')
    for (const button of entry.node.querySelectorAll('button')) button.disabled = true
    const pending = { allow: '允许中…', 'allow-tool': '放行中…', reject: '拒绝中…' }
    if (state) state.textContent = pending[decision] || '提交中…'
    try {
      await api('/api/console/approval', { method: 'POST', body: { id, decision } })
      entry.decided = decision
      settleApprovalNode(entry)
      const done = {
        allow: '已允许这一次，只对这一条调用生效。',
        'allow-tool': '已允许。本会话内这个工具不再询问，换对话后恢复。',
        reject: '已拒绝这一条调用。',
      }
      pushToast(done[decision] || '已提交。', 'ok')
    } catch (error) {
      for (const button of entry.node.querySelectorAll('button')) button.disabled = false
      if (state) state.textContent = `提交失败：${messageOf(error)}`
      pushToast(`审批没提交上：${messageOf(error)}`, 'err')
    }
  }

  async function openReport(runId) {
    try {
      const data = await api(`/api/console/runs/${encodeURIComponent(runId)}`)
      dialogTitleEl.textContent = data.goal || '报告'
      dialogMetaEl.textContent = ''
      const meta = [
        `状态 ${statusText(data.status)}`,
        data.cost?.text ? `成本 ${data.cost.text}` : null,
        data.usage ? `${formatTokens(data.usage.totalTokens)} tokens` : null,
        data.finishedAt ? `结束 ${timeLabel(data.finishedAt)}` : null,
      ].filter(Boolean)
      for (const value of meta) dialogMetaEl.append(el('span', '', value))
      setDialogActions([])
      if (data.report) renderMarkdownInto(dialogReportEl, data.report)
      else {
        dialogReportEl.textContent = ''
        dialogReportEl.append(el('p', '', '（这条任务线还没有报告）'))
      }
      reportDialogEl.showModal()
    } catch (error) {
      pushToast(`读取报告失败：${messageOf(error)}`, 'err')
    }
  }

  // ---------- SSE ----------

  function handleFrame(frame) {
    if (!frame || typeof frame !== 'object') return
    switch (frame.type) {
      case 'hello':
        setSession(frame.sessionId)
        setMode(frame.mode === 'chat' || STATE.router ? 'chat' : 'unavailable', frame.capabilities)
        setConn('live', '已连接')
        break
      case 'router.changed':
        refreshRouter().catch(() => {})
        break
      case 'session':
        if (frame.sessionId && frame.sessionId !== STATE.sessionId) {
          setSession(frame.sessionId)
          STATE.approvals.clear()
          STATE.railDetail = null
          clearMessages()
          renderEmpty()
          loadSchedules()
        }
        break
      case 'stream.snapshot':
        clearMessages()
        if (frame.header && frame.header.id) setSession(frame.header.id)
        for (const record of Array.isArray(frame.records) ? frame.records : []) {
          if (record && record.type === 'event' && record.event) handleSessionEvent(record.event)
        }
        removeEmpty()
        if (STATE.messages.length === 0) renderEmpty()
        renderApprovals()
        scrollToEnd()
        break
      case 'session.event':
        handleSessionEvent(frame.event)
        break
      case 'assistant.frame':
        handleAssistantFrame(frame.frame)
        break
      case 'session.state':
        applySessionState(frame.state)
        break
      case 'accepted':
        for (let i = STATE.messages.length - 1; i >= 0; i -= 1) {
          const message = STATE.messages[i]
          if (message.role === 'user' && message.pending && message.text === frame.text) {
            message.pending = false
            message.at = Date.now()
            refreshMessage(message)
            break
          }
        }
        break
      case 'approval': {
        const approval = frame.approval
        if (frame.action === 'asked' && approval && approval.id) {
          seatApproval(approval)
          refreshNotices({ toastNew: true })
          pushToast('有工具调用等你决定。', 'warn')
          queueRail()
        } else if (frame.action === 'auto') {
          pushToast(`已放行 ${frame.toolName || '这个工具'}，本会话内不再询问。`, 'ok')
        } else if ((frame.action === 'decided' || frame.action === 'expired') && frame.id) {
          const entry = STATE.approvals.get(frame.id)
          if (entry) {
            entry.decided = frame.action === 'expired'
              ? 'expired'
              : frame.scope === 'tool' ? 'allow-tool'
                : frame.outcome === 'allowed-once' ? 'allow'
                  : frame.outcome === 'rejected' ? 'reject' : 'cancelled'
            settleApprovalNode(entry)
            refreshNotices()
            queueRail()
          }
        }
        break
      }
      case 'runs':
        STATE.runs = Array.isArray(frame.runs) ? frame.runs : []
        renderLanes()
        refreshNotices({ toastNew: true })
        break
      case 'answered':
        pushToast(`已提交 ${frame.attentionId || '决定'}。`, 'ok')
        break
      case 'canceling':
        if (frame.runId) {
          STATE.cancelRequested.add(frame.runId)
          renderLanes()
        }
        break
      case 'error':
        if (frame.code === 'follow-failed' || frame.code === 'state-failed') {
          setConn('warn', '流中断')
        }
        pushToast(frame.message || '控制台连接出错', 'err')
        break
      case 'truncated':
        pushToast('历史太长，只显示了一部分。', 'err')
        break
      case 'closed':
        setConn('warn', '已关闭')
        break
      default:
        break
    }
  }

  function handleSessionEvent(event) {
    if (!event || typeof event !== 'object') return
    const data = event.data && typeof event.data === 'object' ? event.data : {}
    switch (event.type) {
      case 'turn/start':
        setTyping(true, '运行中')
        break
      case 'turn/end':
        setTyping(false)
        if (STATE.currentAssistant) {
          STATE.currentAssistant.streaming = false
          refreshMessage(STATE.currentAssistant)
          STATE.currentAssistant = null
        }
        break
      case 'user/message': {
        if (data.source && data.source.kind && data.source.kind !== 'user') break
        const text = contentText(data.content).trim()
        if (!text) break
        removeEmpty()
        let matched = null
        for (let i = STATE.messages.length - 1; i >= 0; i -= 1) {
          const message = STATE.messages[i]
          if (message.role === 'user' && message.pending && message.text.trim() === text) {
            matched = message
            break
          }
        }
        if (matched) {
          matched.pending = false
          matched.at = event.time || Date.now()
          refreshMessage(matched)
        } else {
          addMessage('user', text, { at: event.time || Date.now() })
        }
        setTyping(true, '运行中')
        break
      }
      case 'assistant/message': {
        const finalText = contentText(data.message?.content)
        const reasoning = contentText((data.message?.content || []).filter(part => part && part.type === 'reasoning'))
        removeEmpty()
        let target = STATE.currentAssistant
        if (!target || (!target.streaming && target.text)) {
          target = addMessage('assistant', finalText, { at: event.time || Date.now(), reasoning })
        } else {
          if (finalText) target.text = finalText
          if (reasoning) target.reasoning = reasoning
          target.streaming = false
          target.at = event.time || target.at
          refreshMessage(target)
        }
        if (data.interrupted === true) {
          target.interrupted = true
          refreshMessage(target)
        }
        const calls = Array.isArray(data.message?.content)
          ? data.message.content.filter(part => part && part.type === 'tool-call')
          : []
        for (const call of calls) {
          upsertTool(target, {
            callId: call.id || call.callId,
            name: call.name || 'tool',
            status: 'ok',
            arguments: call.arguments,
          })
        }
        STATE.currentAssistant = null
        break
      }
      case 'tool/call':
        removeEmpty()
        if (!STATE.currentAssistant) addMessage('assistant', '', { at: event.time || Date.now(), streaming: true })
        upsertTool(STATE.currentAssistant, {
          callId: data.callId,
          name: data.name || 'tool',
          status: 'running',
          arguments: data.arguments,
        })
        break
      case 'tool/result': {
        // The host carries the call id on the tool message, not on the event.
        const callId = data.callId || data.message?.toolCallId || data.message?.source?.callId
        const call = STATE.toolCalls.get(callId)
        if (!call) break
        call.status = data.message?.isError ? 'err' : 'ok'
        call.done = true
        call.result = contentText(data.message?.content).slice(0, 4000)
        const message = call.message
        if (message && message.toolsEl) {
          const chip = message.toolsEl.querySelector(`[data-call-id="${cssEscape(callId || '')}"]`)
          if (chip) chip.replaceWith(toolChip(call))
        }
        break
      }
      case 'step/start':
        setTyping(true, '运行中')
        break
      case 'step/end':
        break
      default:
        break
    }
  }

  function upsertTool(message, tool) {
    if (!message) return
    tool.message = message
    tool.done = tool.done === true
    const existing = STATE.toolCalls.get(tool.callId)
    if (existing) {
      Object.assign(existing, tool)
    } else {
      STATE.toolCalls.set(tool.callId, tool)
      message.tools = message.tools || []
      message.tools.push(tool)
    }
    if (message.toolsEl) {
      const key = tool.callId || ''
      const current = message.toolsEl.querySelector(`[data-call-id="${cssEscape(key)}"]`)
      const chip = toolChip(existing || tool)
      if (current) current.replaceWith(chip)
      else message.toolsEl.append(chip)
    }
    scrollToEnd()
  }

  function handleAssistantFrame(frame) {
    if (!frame || typeof frame !== 'object') return
    if (frame.type === 'start') {
      removeEmpty()
      const message = addMessage('assistant', '', { streaming: true, at: Date.now() })
      STATE.currentAssistant = message
      setTyping(true, '生成中')
      return
    }
    if (frame.type === 'chunk' && frame.chunk) {
      const chunk = frame.chunk
      if (chunk.type === 'text-delta') {
        if (!STATE.currentAssistant) addMessage('assistant', '', { streaming: true, at: Date.now() })
        STATE.currentAssistant.text += chunk.text || ''
        refreshMessage(STATE.currentAssistant)
        scrollToEnd()
      } else if (chunk.type === 'reasoning-delta') {
        if (!STATE.currentAssistant) addMessage('assistant', '', { streaming: true, at: Date.now() })
        STATE.currentAssistant.reasoning = (STATE.currentAssistant.reasoning || '') + (chunk.text || '')
        refreshMessage(STATE.currentAssistant)
      } else if (chunk.type === 'tool-call-delta') {
        if (!STATE.currentAssistant) addMessage('assistant', '', { streaming: true, at: Date.now() })
        upsertTool(STATE.currentAssistant, {
          callId: chunk.id,
          name: chunk.name || 'tool',
          status: 'running',
          arguments: chunk.argumentsDelta || '',
        })
      }
      return
    }
    if (frame.type === 'end') {
      if (STATE.currentAssistant) {
        STATE.currentAssistant.streaming = false
        refreshMessage(STATE.currentAssistant)
      }
      setTyping(false)
    }
  }

  function applySessionState(state) {
    if (!state || typeof state !== 'object') return
    STATE.pendingInput = Array.isArray(state.pendingInput) ? state.pendingInput : []
    if (STATE.pendingInput.includes('approval')) setTyping(true, '等待审批')
    else if (STATE.pendingInput.includes('question')) setTyping(true, '等待回答')
    else setTyping(state.running === true, state.queue && state.queue.length ? `运行中 · 队列 ${state.queue.length}` : '运行中')
  }

  // ---------- API ----------

  async function api(path, options = {}) {
    const headers = { authorization: `Bearer ${STATE.token}` }
    if (options.body !== undefined) headers['content-type'] = 'application/json'
    const response = await fetch(path, {
      method: options.method || 'GET',
      headers,
      body: options.body === undefined ? undefined : JSON.stringify(options.body),
      signal: options.signal,
    })
    let payload = null
    try {
      payload = await response.json()
    } catch {
      payload = null
    }
    if (!response.ok) {
      const error = new Error(payload?.error?.summary || payload?.error?.detail || `HTTP ${response.status}`)
      error.status = response.status
      error.code = payload?.error?.id
      error.hint = payload?.error?.hint
      throw error
    }
    return payload?.data
  }

  function applyBootstrap(data) {
    STATE.booted = true
    STATE.router = data.mode === 'router'
    setMode(data.mode === 'chat' || STATE.router ? 'chat' : 'unavailable', data.capabilities)
    if (STATE.router) {
      newChatEl.style.display = 'none'
      $('historyOpen').style.display = 'none'
      stopAllEl.style.display = 'none'
      document.querySelector('[aria-label="发送方式"]')?.closest('section')?.setAttribute('hidden', '')
      sessionLabelEl.textContent = '超级智能体'
      sessionLabelEl.title = '超级智能体'
      renderRouterMessages(data.router)
    }
    if (data.sessionId) setSession(data.sessionId)
    if (data.preset) STATE.preset = data.preset
    STATE.runs = Array.isArray(data.runs) ? data.runs : []
    STATE.readNotices = new Set(Array.isArray(data.readNoticeIds) ? data.readNoticeIds : [])
    renderLanes()
    for (const approval of Array.isArray(data.approvals) ? data.approvals : []) seatApproval(approval)
    refreshNotices()
    if (STATE.messages.length === 0) renderEmpty()
    if (!STATE.router) {
      loadTools()
      loadSchedules()
    }
    wizardLoad({ probe: false, auto: true })
  }

  const toolCountEl = $('toolCount')
  const toolNoteEl = $('toolNote')
  const toolListEl = $('toolList')

  /** Group a tool by the capability it would give the conversation. */
  function toolGroup(name) {
    if (name.startsWith('browser_')) return 'browser'
    if (name.startsWith('desktop_')) return 'desktop'
    if (/3d|blender|mesh|gltf|glb|fbx|stl|obj|step|cad/i.test(name)) return '3d'
    return 'other'
  }

  function renderTools(data) {
    toolListEl.textContent = ''
    toolCountEl.textContent = '—'
    const tools = Array.isArray(data?.tools) ? data.tools : null
    if (!tools) {
      if (data == null) toolNoteEl.textContent = '加载中…'
      else if (data.reason === 'no-session') toolNoteEl.textContent = '还没有会话。'
      else toolNoteEl.textContent = `读不到工具清单：${data.reason || '宿主未返回'}`
      return
    }
    toolCountEl.textContent = String(tools.length)
    const counts = { browser: 0, desktop: 0, '3d': 0 }
    for (const tool of tools) {
      const group = toolGroup(tool.name)
      if (group in counts) counts[group] += 1
      const chip = el('span', `tool-name${group === 'browser' || group === 'desktop' ? ' on' : ''}`, tool.name)
      if (tool.description) chip.title = tool.description
      toolListEl.append(chip)
    }
    toolNoteEl.textContent = [
      `浏览器控制：${counts.browser ? `${counts.browser} 个 browser_* 工具` : '未挂载'}`,
      `桌面控制：${counts.desktop ? `${counts.desktop} 个 desktop_* 工具` : '未挂载'}`,
      `3D 建模：${counts['3d']
        ? `${counts['3d']} 个相关工具`
        : `未发现专用工具${tools.some(tool => tool.name === 'bash' || tool.name === 'pwsh')
          ? '（可经 shell 调 headless Blender）'
          : ''}`}`,
    ].join(' · ')
  }

  async function loadTools() {
    if (!STATE.sessionId || STATE.mode !== 'chat') return
    try {
      renderTools(await api(`/api/console/tools?sessionId=${encodeURIComponent(STATE.sessionId)}`))
    } catch (error) {
      renderTools({ reason: messageOf(error) })
    }
  }

  // ---------- first-use wizard ----------

  const WIZ_STEP_LABELS = ['环境自检', 'key 与模型', '确认写入', '试跑示例']

  function wizardBusyNode(text) {
    const row = el('div', 'wiz-busy')
    row.append(el('span', 'spin'))
    row.append(el('span', '', text))
    return row
  }

  function wizardErrorNode() {
    if (!WIZ.error) return null
    const box = el('div', 'wiz-error')
    box.append(el('b', '', WIZ.error.message))
    if (WIZ.error.hint) box.append(el('div', '', WIZ.error.hint))
    return box
  }

  function updateEnvBar(status) {
    const items = Array.isArray(status?.environment) ? status.environment : []
    const broken = items.filter(item => !item.ok)
    if (!status || broken.length === 0) {
      envBarEl.hidden = true
      envItemsEl.replaceChildren()
      return
    }
    envBarEl.hidden = false
    envItemsEl.replaceChildren()
    for (const item of broken) {
      const chip = el('button', `env-item ${item.ok ? 'ok' : 'bad'}`)
      chip.type = 'button'
      chip.title = item.hint || item.value || ''
      chip.append(el('span', 'dot'))
      chip.append(el('span', '', item.label))
      chip.append(el('span', 'env-value', item.value || ''))
      chip.append(el('span', 'env-action', '去处理'))
      chip.addEventListener('click', () => wizardOpen(item.action?.step || 1))
      envItemsEl.append(chip)
    }
  }

  async function wizardLoad({ probe = false, auto = false } = {}) {
    if (!STATE.token) return
    // Status loads overlap (bootstrap, auto-open, retry); a counter keeps one
    // finishing load from clearing another's state or leaving a stale busy flag.
    WIZ.statusPending += 1
    if (WIZ.open) renderWizard()
    try {
      const data = await api(`/api/console/wizard/status?probe=${probe ? 1 : 0}`)
      WIZ.status = data
      if (!WIZ.formTouched) {
        WIZ.form.provider = data.provider || data.defaults.provider
        WIZ.form.baseURL = data.baseURL || data.defaults.baseURL
        WIZ.form.model = data.model || data.defaults.model
      }
      WIZ.error = null
      updateEnvBar(data)
      if (auto && data.needsSetup && !WIZ.autoOpened) {
        WIZ.autoOpened = true
        wizardOpen(1)
      }
    } catch (error) {
      if (error.status === 401) return
      if (WIZ.open) {
        WIZ.error = { message: messageOf(error), hint: error.hint, code: error.code }
      }
    } finally {
      WIZ.statusPending = Math.max(0, WIZ.statusPending - 1)
      if (WIZ.open) renderWizard()
    }
  }

  function wizardOpen(step) {
    WIZ.open = true
    if (!wizardDialogEl.open) {
      if (typeof wizardDialogEl.showModal === 'function') wizardDialogEl.showModal()
      else wizardDialogEl.setAttribute('open', '')
    }
    if (step) WIZ.step = step
    WIZ.error = null
    renderWizard()
    if (!WIZ.status) wizardLoad({ probe: true })
    else if (WIZ.step === 1) wizardLoad({ probe: false })
  }

  function wizardClose() {
    WIZ.open = false
    if (wizardDialogEl.open) wizardDialogEl.close()
  }

  function wizardGo(step) {
    if (step === 3 && !WIZ.preview) return
    if (step === 4 && !WIZ.saved) return
    WIZ.step = step
    WIZ.error = null
    renderWizard()
  }

  function wizardHandleAction(action) {
    if (!action) return
    if (action.kind === 'retry') {
      wizardLoad({ probe: true })
      return
    }
    if (action.kind === 'reload') {
      window.location.reload()
      return
    }
    wizardGo(action.step || 1)
  }

  function keyBadgeState() {
    const failed = WIZ.error && ['key-rejected', 'model-missing', 'base-unreachable', 'base-timeout', 'endpoint-http', 'endpoint-invalid', 'base-tls'].includes(WIZ.error.code)
    if (failed) return { text: '未通过', kind: 'bad' }
    if (WIZ.preview?.key?.verified) return { text: '已验证', kind: 'ok' }
    if (WIZ.status?.key?.verified) return { text: '已验证', kind: 'ok' }
    if (WIZ.status?.key?.configured) return { text: '未验证', kind: 'bad' }
    if (WIZ.form.apiKey?.trim()) return { text: '未验证', kind: 'bad' }
    return { text: '未配置', kind: '' }
  }

  function updateKeyBadge() {
    const badge = $('wizKeyBadge')
    if (!badge) return
    const state = keyBadgeState()
    badge.className = `wiz-badge ${state.kind}`.trim()
    badge.textContent = state.text
  }

  function renderWizard() {
    if (!WIZ.open) return
    wizardStepsEl.replaceChildren()
    WIZ_STEP_LABELS.forEach((label, index) => {
      const number = index + 1
      const node = el(
        'div',
        `wiz-step${number === WIZ.step ? ' active' : ''}${number < WIZ.step ? ' done' : ''}`,
        `${number} ${label}`,
      )
      wizardStepsEl.append(node)
    })
    wizardBodyEl.replaceChildren()
    if (WIZ.step === 1) renderWizardStep1()
    else if (WIZ.step === 2) renderWizardStep2()
    else if (WIZ.step === 3) renderWizardStep3()
    else renderWizardStep4()
  }

  function renderWizardStep1() {
    wizardBodyEl.append(el('p', 'wiz-lead', '先检查宿主和环境。没通过的项直接点“去处理”。'))
    if (!WIZ.status) {
      wizardBodyEl.append(WIZ.statusPending > 0 ? wizardBusyNode('检查中…') : el('p', 'wiz-note', '还没有读到检查结果。'))
    } else {
      const list = el('div', 'wiz-checks')
      for (const item of WIZ.status.environment || []) {
        const row = el('div', `wiz-check${item.ok ? '' : ' bad'}`)
        row.append(el('span', 'dot'))
        const body = el('div', 'body')
        const line = el('div', 'label', item.label)
        if (item.value) line.append(el('span', 'value', item.value))
        body.append(line)
        if (item.hint) body.append(el('div', 'hint', item.hint))
        row.append(body)
        if (!item.ok && item.action) {
          const button = el('button', '', '去处理')
          button.type = 'button'
          button.addEventListener('click', () => wizardHandleAction(item.action))
          row.append(button)
        }
        list.append(row)
      }
      wizardBodyEl.append(list)
      if (WIZ.status.profile?.patchPath) {

    if (!window.confirm(`回滚到 ${when} 写入前的配置？API key 不会被删除。`)) return
    WIZ.busy = 'rollback'
