<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Superagent 控制台</title>
<script>
  /* The shell decides the palette: it reports its own theme (its body carries
     `data-ds-dark-theme`), and the OS scheme is the fallback. This runs before
     the stylesheet paints so the page never flashes the wrong theme. */
  (function () {
    var asked = new URLSearchParams(location.search).get('theme')
    if (asked !== 'dark' && asked !== 'light') {
      asked = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    }
    document.documentElement.dataset.theme = asked
  })()
  /* The shell may switch appearance while this page is open; it posts the new
     theme, and the palette follows without a reload. */
  window.addEventListener('message', function (event) {
    if (event.source !== window.parent) return
    var data = event.data
    if (!data || data.type !== 'dsh-superagent-theme') return
    if (data.theme === 'dark' || data.theme === 'light') document.documentElement.dataset.theme = data.theme
  })
</script>
<style>
  /* Palette taken from the host's design tokens
     (@deepseek-ai/dsh-client-ui-theme/src/styles/design-platform.css):
     bg-base / bg-layer-1..3, border-l1..l4, label-primary..caption,
     brand-primary, state-*, radius 4/8/12/16/20/28, 2px focus ring.
     Light is the host default; `[data-theme='dark']` is the host's dark set. */
  :root {
    color-scheme: light;
    --bg: rgb(255, 255, 255);
    --panel: rgb(255, 255, 255);
    --panel-2: rgb(250, 250, 250);
    --line: rgba(0, 0, 0, .10);
    --line-soft: rgba(0, 0, 0, .06);
    --line-strong: rgba(0, 0, 0, .16);
    --text: rgb(15, 17, 21);
    --muted: rgb(97, 102, 107);
    --faint: rgb(129, 133, 140);
    --accent: rgb(65, 118, 230);
    --accent-ink: rgb(255, 255, 255);
    --amber: rgb(221, 134, 41);
    --amber-soft: color-mix(in srgb, rgb(245, 158, 11) 10%, transparent);
    --red: rgb(236, 19, 19);
    --green: rgb(34, 197, 94);
    --blue: var(--accent);
    --violet: rgb(124, 58, 237);
    --hover: rgba(38, 49, 72, .06);
    --active: rgba(38, 49, 72, .10);
    --primary-bg: rgb(15, 17, 21);
    --primary-fg: rgb(255, 255, 255);
    --input-bg: rgb(255, 255, 255);
    --card-bg: rgb(250, 250, 250);
    --scroll-thumb: rgb(229, 229, 229);
    --scroll-thumb-hover: rgb(212, 212, 212);
    --toast-bg: rgb(53, 54, 56);
    --toast-fg: rgb(255, 255, 255);
    --radius: 16px;
    --mono: "SF Mono", "JetBrains Mono", "Fira Code", Consolas, ui-monospace, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  :root[data-theme='dark'] {
    color-scheme: dark;
    --bg: rgb(21, 21, 23);
    --panel: rgb(35, 35, 36);
    --panel-2: rgb(44, 44, 46);
    --line: rgba(255, 255, 255, .12);
    --line-soft: rgba(255, 255, 255, .06);
    --line-strong: rgba(255, 255, 255, .20);
    --text: rgb(249, 250, 251);
    --muted: rgb(207, 211, 214);
    --faint: rgb(129, 133, 140);
    --accent: rgb(122, 170, 255);
    --accent-ink: rgb(15, 17, 21);
    --amber: rgb(245, 158, 11);
    --amber-soft: color-mix(in srgb, rgb(245, 158, 11) 12%, transparent);
    --red: rgb(242, 90, 90);
    --green: rgb(34, 197, 94);
    --blue: var(--accent);
    --violet: rgb(167, 139, 250);
    --hover: rgba(255, 255, 255, .08);
    --active: rgba(255, 255, 255, .14);
    --primary-bg: rgb(249, 250, 251);
    --primary-fg: rgb(15, 17, 21);
    --input-bg: rgb(44, 44, 46);
    --card-bg: rgb(44, 44, 46);
    --scroll-thumb: rgb(60, 60, 61);
    --scroll-thumb-hover: rgb(84, 85, 87);
    --toast-bg: rgb(67, 69, 74);
    --toast-fg: rgb(255, 255, 255);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }

  .shell { height: 100%; display: flex; flex-direction: column; }
  .topbar {
    position: relative; z-index: 22;
    flex: 0 0 58px;
    display: flex; align-items: center; gap: 18px;
    padding: 0 20px;
    border-bottom: 1px solid var(--line-soft);
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(10px);
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 176px; }
  .mark {
    width: 30px; height: 30px; border-radius: 9px;
    display: grid; place-items: center;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 800; font-size: 15px;
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 8px 24px color-mix(in srgb, var(--accent) 12%, transparent);
  }
  .brand strong { display: block; font-size: 14px; letter-spacing: .2px; }
  .brand span { display: block; color: var(--faint); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .topbar-mid { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    height: 24px; padding: 0 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); font-size: 12px; white-space: nowrap;
  }
  .badge.chat { color: var(--green); border-color: color-mix(in srgb, var(--green) 32%, transparent); background: color-mix(in srgb, var(--green) 8%, transparent); }
  .badge.off { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 32%, transparent); background: var(--amber-soft); }
  .badge .pulse { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .session-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
  .topbar-actions { display: flex; align-items: center; gap: 12px; }
  .conn { display: inline-flex; align-items: center; gap: 7px; color: var(--faint); font-size: 12px; white-space: nowrap; }
  .conn i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
  .conn.live i { background: var(--green); box-shadow: 0 0 0 4px color-mix(in srgb, var(--green) 12%, transparent); }
  .conn.warn i { background: var(--amber); }
  .btn {
    height: 30px; padding: 0 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    font-size: 12px;
  }
  .btn:hover { color: var(--text); border-color: var(--line-strong); background: var(--hover); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 30%, transparent); }
  .btn.danger:hover { background: color-mix(in srgb, var(--red) 8%, transparent); border-color: color-mix(in srgb, var(--red) 45%, transparent); }

  .panel {
    min-height: 0; display: flex; flex-direction: column;
    border: 1px solid var(--line-soft); border-radius: var(--radius);
    background: var(--panel);
    overflow: hidden;
  }
  .chat-head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
    padding: 16px 20px 13px; border-bottom: 1px solid var(--line-soft);
  }
  .chat-head h1 { margin: 0; font-size: 15px; letter-spacing: .1px; }
  .chat-head p { margin: 4px 0 0; color: var(--faint); font-size: 12px; }
  .chat-head p strong { color: var(--muted); font-weight: 600; }
  .typing { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
  .typing span { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .18s; }
  .typing span:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

  .messages {
    flex: 1; min-height: 0; overflow-y: auto;
    padding: 20px 20px 26px; scroll-behavior: smooth;
  }
  .messages::-webkit-scrollbar, .run-list::-webkit-scrollbar, pre::-webkit-scrollbar { width: 10px; height: 10px; }
  .messages::-webkit-scrollbar-thumb, .run-list::-webkit-scrollbar-thumb, pre::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb); border: 3px solid transparent; background-clip: padding-box; border-radius: 999px;
  }
  .msg { display: flex; flex-direction: column; max-width: 820px; margin: 0 0 18px; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg.user { margin-left: auto; align-items: flex-end; }
  .msg.assistant { margin-right: auto; align-items: flex-start; }
  .who { margin: 0 4px 5px; color: var(--faint); font-size: 11px; letter-spacing: .05em; }
  .bubble {
    position: relative; max-width: 100%;
    padding: 10px 13px; border-radius: 12px;
    border: 1px solid var(--line-soft); background: var(--panel-2);
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble {
    background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 13%, transparent), color-mix(in srgb, var(--accent) 7%, transparent));
    border-color: color-mix(in srgb, var(--accent) 26%, transparent);
    border-bottom-right-radius: 4px;
  }
  .msg.assistant .bubble { border-bottom-left-radius: 4px; }
  .msg.pending .bubble { opacity: .72; }
  .msg.failed .bubble { border-color: color-mix(in srgb, var(--red) 48%, transparent); }
  .msg .text { min-height: 1em; }
  .msg .text .para { white-space: pre-wrap; }
  .msg .text pre {
    margin: 8px 0; padding: 10px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg);
    overflow: auto; font: 12px/1.6 var(--mono); white-space: pre;
  }
  .msg .text .cursor {
    display: inline-block; width: 7px; height: 15px; margin-left: 2px;
    background: var(--accent); vertical-align: -2px; animation: caret 1s steps(2) infinite;
  }
  @keyframes caret { 50% { opacity: 0; } }
  .msg .meta { margin: 5px 4px 0; color: var(--faint); font-size: 11px; }
  .msg .meta .failed { color: var(--red); }
  .msg-actions { display: flex; gap: 4px; margin: 5px 4px 0; }
  .msg.user .msg-actions { justify-content: flex-end; }
  .msg-actions[hidden] { display: none; }
  .msg-actions button {
    padding: 1px 4px; border: 0; border-radius: 5px; background: transparent;
    color: var(--faint); font: 11px var(--sans); cursor: pointer;
  }
  .msg-actions button:hover { color: var(--text); background: rgba(255, 255, 255, .06); }
  .reasoning { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 7px; }
  .reasoning summary { color: var(--faint); font-size: 11px; cursor: pointer; }
  .reasoning pre { margin: 6px 0 0; color: var(--muted); font: 12px/1.6 var(--mono); white-space: pre-wrap; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .tool {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--bg);
    color: var(--muted); font: 11px/1.5 var(--mono);
  }
  .tool .tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); }
  .tool.ok .tdot { background: var(--green); }
  .tool.err .tdot { background: var(--red); }
  .tool.running .tdot { background: var(--amber); animation: blink 1.1s infinite; }
  .tool details { display: inline; }
  .tool summary { color: var(--faint); cursor: pointer; list-style: none; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool pre { max-width: 520px; max-height: 180px; overflow: auto; margin: 6px 0 0; font: 11px/1.5 var(--mono); white-space: pre-wrap; }
  .tool .targs {
    max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--faint); font-size: 10.5px;
  }
  .tool.err { border-color: color-mix(in srgb, var(--red) 40%, transparent); }
  .tool .err-mark { color: var(--red); }

  .empty { max-width: 560px; margin: 7vh auto 0; text-align: center; }
  .empty .orb {
    width: 58px; height: 58px; margin: 0 auto 18px; border-radius: 18px;
    display: grid; place-items: center;
    background: linear-gradient(145deg, color-mix(in srgb, var(--accent) 22%, transparent), color-mix(in srgb, var(--accent) 14%, transparent));
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    color: var(--accent); font-size: 24px; font-weight: 800;
    box-shadow: 0 18px 50px color-mix(in srgb, var(--accent) 8%, transparent);
  }
  .empty h1 { margin: 0 0 8px; font-size: 23px; letter-spacing: -.02em; }
  .empty p { margin: 0 auto 18px; max-width: 460px; color: var(--muted); }
  .examples { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .examples button {
    padding: 7px 11px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--panel); color: var(--muted);
    font-size: 12px;
  }
  .examples button:hover { color: var(--text); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .empty.unavailable .orb { background: var(--amber-soft); border-color: color-mix(in srgb, var(--amber) 35%, transparent); color: var(--amber); }
  .empty.unavailable h1 { font-size: 20px; }
  .empty .reason {
    margin-top: 12px; padding: 10px 12px; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--amber) 28%, transparent); background: var(--amber-soft);
    color: var(--amber); font-size: 12px; text-align: left; white-space: pre-wrap;
  }

  .composer { padding: 12px 14px 14px; border-top: 1px solid var(--line-soft); background: var(--bg); }
  .composer-box {
    border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
    transition: border-color .15s, box-shadow .15s;
  }
  .composer-box:focus-within { border-color: color-mix(in srgb, var(--accent) 42%, transparent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 7%, transparent); }
  .composer textarea {
    display: block; width: 100%; min-height: 46px; max-height: 180px;
    padding: 12px 13px 4px; border: 0; outline: 0; resize: none;
    background: transparent; color: var(--text);
  }
  .composer textarea::placeholder { color: var(--faint); }
  .composer-bar { display: flex; align-items: center; gap: 10px; padding: 4px 8px 8px 10px; }
  .segmented { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--hover); border: 1px solid var(--line-soft); }
  .segmented button {
    height: 24px; padding: 0 8px; border: 0; border-radius: 6px;
    background: transparent; color: var(--faint); font-size: 11px;
  }
  .segmented button.active { background: var(--panel-2); color: var(--text); }
  .hint { flex: 1; color: var(--faint); font-size: 11px; text-align: right; }
  .send {
    width: 32px; height: 32px; border-radius: 9px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    background: var(--accent); color: var(--accent-ink);
    font-size: 17px; font-weight: 800; line-height: 1;
  }
  .send:disabled { opacity: .35; cursor: default; }
  .composer.note { color: var(--faint); font-size: 12px; text-align: center; padding: 18px; }

  .count {
    min-width: 24px; height: 22px; padding: 0 7px; border-radius: 999px;
    display: inline-grid; place-items: center;
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    font: 11px var(--mono);
  }
  .tools:empty { display: none; }
  .tools-note { margin: 7px 0 0; color: var(--faint); font-size: 11px; line-height: 1.6; }
  .tool-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; max-height: 132px; overflow-y: auto; }
  .tool-name {
    padding: 2px 6px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--muted); font: 10.5px var(--mono);
  }
  .tool-name.on { border-color: color-mix(in srgb, var(--accent) 35%, transparent); color: var(--green); }
  .status-pill {
    flex: none; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); font-size: 10.5px; white-space: nowrap;
  }
  .status-pill.running { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 32%, transparent); background: var(--amber-soft); }
  .status-pill.completed { color: var(--green); border-color: color-mix(in srgb, var(--green) 32%, transparent); background: color-mix(in srgb, var(--green) 7%, transparent); }
  .status-pill.failed, .status-pill.interrupted { color: var(--red); border-color: color-mix(in srgb, var(--red) 32%, transparent); background: color-mix(in srgb, var(--red) 7%, transparent); }
  .progress { height: 3px; margin: 9px 0 0; border-radius: 999px; background: var(--panel-2); overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s; }
  .attention-card {
    margin-top: 10px; padding: 10px; border-radius: 9px;
    border: 1px solid color-mix(in srgb, var(--amber) 36%, transparent); background: var(--amber-soft);
  }
  .attention-card .kicker {
    color: var(--amber); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase;
  }
  .attention-card p { margin: 5px 0 0; color: var(--amber); font-size: 12px; line-height: 1.55; white-space: pre-wrap; }
  .attention-card .reason { color: var(--faint); font-size: 11px; }
  .approval-card {
    margin-top: 10px; padding: 10px 12px; border-radius: 9px;
    border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent); background: var(--amber-soft);
  }
  .approval-card .kicker {
    color: var(--amber); font: 10px var(--mono); letter-spacing: .08em; text-transform: uppercase;
  }
  .approval-card .what { margin-top: 6px; color: var(--amber); font-size: 11.5px; }
  .approval-card .what b { color: var(--amber); font-weight: 600; }
  .approval-card .where {
    margin-top: 6px; padding: 5px 7px; border-radius: 6px;
    background: var(--bg); color: var(--amber);
    font: 11px var(--mono); word-break: break-all;
  }
  .approval-card .why {
    margin: 6px 0 0; color: var(--amber); font-size: 12px; line-height: 1.55; white-space: pre-wrap;
  }
  .approval-card .state { margin-top: 8px; color: var(--faint); font-size: 11px; }
  .approval-card .options { margin-top: 8px; }
  .approval-card .options button.allow {
    border-color: color-mix(in srgb, var(--green) 50%, transparent); background: color-mix(in srgb, var(--green) 12%, transparent); color: var(--green);
  }
  .approval-card .options button.reject {
    border-color: color-mix(in srgb, var(--red) 50%, transparent); background: color-mix(in srgb, var(--red) 10%, transparent); color: var(--red);
  }
  .options { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .options button {
    padding: 4px 9px; border-radius: 7px;
    border: 1px solid color-mix(in srgb, var(--amber) 38%, transparent); background: color-mix(in srgb, var(--amber) 8%, transparent);
    color: var(--amber); font-size: 11px;
  }
  .options button:hover { background: color-mix(in srgb, var(--amber) 18%, transparent); }
  .options button:disabled { opacity: .45; }
  .approval-card .options button.allow-tool {
    border-color: color-mix(in srgb, var(--accent) 38%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent);
  }
  .approval-card .call { margin-top: 7px; }
  .approval-card .call summary {
    color: var(--faint); font-size: 11px; cursor: pointer; list-style: none;
  }
  .approval-card .call summary::-webkit-details-marker { display: none; }
  .approval-card .call summary::before { content: '▸ '; }
  .approval-card .call[open] summary::before { content: '▾ '; }
  .approval-card .call pre {
    max-height: 240px; overflow: auto; margin: 6px 0 0; padding: 8px 9px;
    border-radius: 7px; border: 1px solid color-mix(in srgb, var(--amber) 22%, transparent);
    background: var(--input-bg); color: var(--text);
    font: 11px/1.55 var(--mono); white-space: pre-wrap; word-break: break-word;
  }
  .approval-card .call .note { margin: 5px 0 0; color: var(--faint); font-size: 10.5px; }
  .approval-card .expiry { margin-top: 6px; color: var(--faint); font-size: 11px; }
  .approval-card .expiry.soon { color: var(--amber); }
  .approval-card .expiry.over { color: var(--red); }
  .free { display: flex; gap: 6px; margin-top: 7px; }
  .free input {
    flex: 1; min-width: 0; height: 29px; padding: 0 8px;
    border: 1px solid color-mix(in srgb, var(--amber) 28%, transparent); border-radius: 7px;
    background: var(--input-bg); color: var(--text); font-size: 11.5px; outline: 0;
  }
  .free input:focus { border-color: color-mix(in srgb, var(--amber) 55%, transparent); }
  .free button {
    height: 29px; padding: 0 9px; border-radius: 7px; border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
    background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); font-size: 11px;
  }
  .report { margin-top: 9px; border-top: 1px dashed var(--line-soft); padding-top: 8px; }
  .report summary { color: var(--muted); font-size: 11px; cursor: pointer; }
  .report pre {
    max-height: 280px; overflow: auto; margin: 7px 0 0; padding: 9px;
    border-radius: 8px; border: 1px solid var(--line-soft); background: var(--bg);
    color: var(--muted); font: 11px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word;
  }
  .env-bar {

  #wizardDialog { width: min(720px, calc(100vw - 32px)); }

  .wiz-body { padding: 14px 18px 8px; overflow: auto; max-height: calc(100vh - 270px); }

  .wiz-check {
    display: flex; align-items: flex-start; gap: 9px; padding: 9px 10px;

  }
  .wiz-check.bad { border-color: color-mix(in srgb, var(--amber) 30%, transparent); background: var(--amber-soft); }
  .wiz-check .dot { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: var(--green); }
  .wiz-check.bad .dot { background: var(--amber); }
  .wiz-check .body { flex: 1; min-width: 0; }
  .wiz-check .label { font-size: 12px; color: var(--text); }
  .wiz-check .value { margin-left: 6px; color: var(--muted); font: 11px var(--mono); word-break: break-all; }
  .wiz-check .hint { margin-top: 3px; color: var(--faint); font-size: 11px; line-height: 1.55; }
  .wiz-check button {

    color: var(--amber); font-size: 11px;

  .wiz-form { display: grid; gap: 10px; }
  .wiz-field label { display: block; margin-bottom: 4px; color: var(--faint); font-size: 11px; }
  .wiz-field input {
    width: 100%; height: 34px; padding: 0 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--text); outline: 0; font-size: 12.5px;
  }
  .wiz-field input:focus { border-color: color-mix(in srgb, var(--accent) 48%, transparent); }
  .wiz-key-row { display: flex; align-items: center; gap: 8px; }
  .wiz-key-row input { flex: 1; min-width: 0; }
  .wiz-key-row .wiz-badge { flex: none; }
  .wiz-note { color: var(--faint); font-size: 11px; line-height: 1.6; }
  .wiz-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 2px 7px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--faint); font-size: 10.5px;
  }
  .wiz-badge.ok { color: var(--green); border-color: color-mix(in srgb, var(--green) 30%, transparent); background: color-mix(in srgb, var(--green) 7%, transparent); }
  .wiz-badge.bad { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 30%, transparent); background: var(--amber-soft); }
  .wiz-error {

  }
  .wiz-error b { display: block; color: var(--red); font-size: 12px; }
  .wiz-summary { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
  .wiz-summary li { position: relative; padding-left: 16px; color: var(--muted); font-size: 12px; line-height: 1.6; }
  .wiz-summary li::before { content: "✓"; position: absolute; left: 0; color: var(--green); }
  .wiz-kv {
    display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; padding: 10px;
    border-radius: 9px; border: 1px solid var(--line-soft); background: var(--bg);

  }
  .wiz-kv b { color: var(--muted); font-weight: 500; }
  .wiz-foot { display: flex; align-items: center; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--line-soft); }
  .wiz-foot .spacer { flex: 1; }
  .wiz-primary {
    height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    background: var(--accent); color: var(--accent-ink);

  }
  .wiz-primary:disabled { opacity: .45; cursor: default; }
  .wiz-secondary {
    height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line);

  }
  .wiz-trial-verdict {

  }
  .wiz-trial-verdict.ok { border-color: color-mix(in srgb, var(--green) 30%, transparent); background: color-mix(in srgb, var(--green) 6%, transparent); color: var(--green); }
  .wiz-trial-verdict.bad { border-color: color-mix(in srgb, var(--amber) 30%, transparent); background: var(--amber-soft); color: var(--amber); }
  .wiz-trial-verdict .big { font-size: 20px; }
  .wiz-trial-verdict .t { font-size: 12.5px; }

  .wiz-steps-list { display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }

  .wiz-task .name { color: var(--text); font-family: var(--mono); font-size: 11px; }
  .wiz-task .detail { margin-top: 2px; color: var(--faint); font-size: 11px; word-break: break-word; }
  .wiz-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
  .wiz-stat { padding: 9px 10px; border-radius: 9px; border: 1px solid var(--line-soft); background: var(--bg); }
  .wiz-stat .k { color: var(--faint); font-size: 10.5px; }
  .wiz-stat .v { margin-top: 2px; color: var(--text); font: 13px var(--mono); word-break: break-all; }
  .wiz-file {
    margin-top: 10px; padding: 8px 10px; border-radius: 8px; border: 1px dashed var(--line);
    color: var(--muted); font-size: 11.5px;
  }
  .wiz-busy { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
  .wiz-busy .spin {
    width: 12px; height: 12px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .toasts { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 30; pointer-events: none; }
  .toast {
    max-width: 520px; padding: 9px 13px; border-radius: 9px;

  }
  .toast.err { border-color: color-mix(in srgb, var(--red) 40%, transparent); color: var(--red); }
  .toast.ok { border-color: color-mix(in srgb, var(--green) 35%, transparent); }
  .toast.warn { border-color: color-mix(in srgb, var(--amber) 40%, transparent); color: var(--amber); }

  .notice-btn { position: relative; }
  .notice-btn.has-unread { border-color: color-mix(in srgb, var(--amber) 50%, transparent); color: var(--amber); }
  .notice-btn .count {
    display: inline-block; min-width: 16px; margin-left: 6px; padding: 0 4px;
    border-radius: 8px; background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber);
    font-size: 11px; text-align: center;
  }
  .notice-panel {
    position: fixed; top: 58px; right: 14px; z-index: 26; width: 322px; max-height: 62vh;
    display: flex; flex-direction: column; padding: 10px 10px 8px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2);
    box-shadow: 0 18px 44px rgba(0, 0, 0, .45);
  }
  .notice-panel[hidden] { display: none; }
  .notice-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; }
  .notice-head .kicker { color: var(--accent); font: 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .notice-list { display: flex; flex-direction: column; gap: 6px; overflow: auto; }
  .notice-item {
    display: flex; gap: 8px; align-items: flex-start; padding: 8px 9px; border-radius: 9px;
    border: 1px solid var(--line-soft); background: var(--bg); font-size: 12px; cursor: pointer;
  }
  .notice-item.unread { border-color: color-mix(in srgb, var(--amber) 35%, transparent); background: color-mix(in srgb, var(--amber) 6%, transparent); }
  .notice-item .dot { width: 6px; height: 6px; margin-top: 5px; border-radius: 50%; background: var(--faint); flex: none; }
  .notice-item.unread .dot { background: var(--amber); }
  .notice-item .body { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .notice-item .title { font-weight: 600; color: var(--text); }
  .notice-item .detail { color: var(--faint); line-height: 1.4; word-break: break-word; }
  .notice-item .when { color: var(--faint); font-size: 11px; }
  .notice-empty { padding: 14px 6px; color: var(--faint); font-size: 12px; text-align: center; }
  .composer.dragover .composer-box {
    border-color: color-mix(in srgb, var(--accent) 70%, transparent); background: color-mix(in srgb, var(--accent) 6%, transparent);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 12%, transparent);
  }

  .gate {
    position: fixed; inset: 0; z-index: 40; display: grid; place-items: center;
    background: color-mix(in srgb, var(--bg) 86%, transparent); backdrop-filter: blur(8px); padding: 20px;
  }
  .gate[hidden] { display: none; }
  .gate-card {
    width: min(420px, 100%); padding: 24px; border-radius: 16px;
    border: 1px solid var(--line); background: var(--panel);
    box-shadow: 0 30px 90px rgba(0, 0, 0, .5);
  }
  .gate-card .mark { margin-bottom: 14px; }
  .gate-card h1 { margin: 0 0 6px; font-size: 18px; }
  .gate-card p { margin: 0 0 16px; color: var(--muted); font-size: 12px; line-height: 1.7; }
  .gate-card label { display: block; color: var(--faint); font-size: 11px; }
  .gate-card input {
    display: block; width: 100%; height: 38px; margin-top: 6px; padding: 0 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); outline: 0;
  }
  .gate-card input:focus { border-color: color-mix(in srgb, var(--accent) 48%, transparent); }
  .gate-card button {
    width: 100%; height: 38px; margin-top: 12px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
    background: var(--accent); color: var(--accent-ink); font-weight: 700;
  }
  .gate-card .error { margin: 10px 0 0; color: var(--red); font-size: 12px; min-height: 1em; }

  dialog {
    width: min(860px, calc(100vw - 40px)); max-height: calc(100vh - 60px);
    padding: 0; border: 1px solid var(--line); border-radius: 14px;
    background: var(--panel); color: var(--text);
    box-shadow: 0 40px 120px rgba(0, 0, 0, .6);
  }
  dialog::backdrop { background: color-mix(in srgb, var(--bg) 72%, transparent); backdrop-filter: blur(4px); }
  .dialog-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line-soft); }
  .dialog-head h2 { flex: 1; margin: 0; font-size: 14px; line-height: 1.5; }
  .dialog-head button { border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; }
  .dialog-body { padding: 16px 18px 20px; overflow: auto; max-height: calc(100vh - 180px); }
  .dialog-meta { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; color: var(--faint); font-size: 11px; }
  .dialog-body pre {
    margin: 0; padding: 13px; border-radius: 9px; border: 1px solid var(--line-soft);
    background: var(--bg); font: 12px/1.65 var(--mono); white-space: pre-wrap; word-break: break-word;
  }
  .dialog-report { font-size: 12.5px; line-height: 1.7; }
  .dialog-report h1, .dialog-report h2, .dialog-report h3, .dialog-report h4 {
    margin: 16px 0 8px; font-size: 14px; line-height: 1.45; color: var(--text);
  }
  .dialog-report h1 { font-size: 17px; }
  .dialog-report h2 { font-size: 15px; }
  .dialog-report p { margin: 0 0 9px; }
  .dialog-report ul, .dialog-report ol { margin: 0 0 10px; padding-left: 22px; }
  .dialog-report li { margin: 3px 0; }
  .dialog-report code {
    padding: 1px 5px; border-radius: 5px; background: color-mix(in srgb, var(--accent) 10%, transparent);
    font: 11.5px var(--mono); color: var(--text);
  }
  .dialog-report pre { margin: 10px 0; }
  .dialog-report pre code { padding: 0; background: transparent; font-size: 11.5px; }
  .dialog-report a { color: var(--accent); }
  .dialog-report iframe { width: 100%; height: min(62vh, 620px); border: 1px solid var(--line-soft); border-radius: 10px; background: #fff; }
  .dialog-report .image-preview { max-width: 100%; border-radius: 10px; border: 1px solid var(--line-soft); }
  .dialog-actions { display: flex; gap: 8px; margin-top: 14px; }
  .dialog-actions .btn { text-decoration: none; }

  /* ---- conversation-first stage ---- */
  .stage { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 0 18px 18px; }
  .stage .panel { width: min(960px, 100%); }
  .chat-head p { color: var(--faint); }

  /* ---- task lanes inside the conversation ---- */
  .lane-group {
    margin: 0 0 18px; padding: 10px 12px 12px;
    border: 1px solid var(--line-soft); border-radius: 12px;
    background: var(--panel);
    animation: rise .18s ease-out;
  }
  .lane-group-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: var(--faint); font-size: 11px; letter-spacing: .03em; }
  .lane-group-head .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: blink 1.2s infinite; }
  .lane-group-head.done .dot { background: var(--green); animation: none; }
  .lane {
    position: relative; margin-top: 8px; padding: 10px 11px;
    border: 1px solid var(--line-soft); border-radius: 10px; background: var(--panel);
  }
  .lane:first-of-type { margin-top: 0; }
  .lane::before { content: ""; position: absolute; left: 0; top: 9px; bottom: 9px; width: 2px; border-radius: 2px; background: var(--line); }
  .lane.running::before { background: var(--amber); }
  .lane.completed::before { background: var(--green); }
  .lane.failed::before { background: var(--red); }
  .lane-head { display: flex; align-items: flex-start; gap: 10px; }
  .lane-title { flex: 1; min-width: 0; }
  .lane-goal { font-size: 12.5px; font-weight: 600; line-height: 1.45; word-break: break-word; }
  .lane-now { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: var(--muted); font-size: 11px; }
  .lane-now .spark { flex: none; width: 5px; height: 5px; border-radius: 50%; background: var(--amber); animation: blink 1.1s infinite; }
  .lane-now .lane-tool { color: var(--faint); font-family: var(--mono); font-size: 10.5px; }
  .lane-time { flex: none; padding-top: 1px; color: var(--faint); font: 10.5px var(--mono); white-space: nowrap; }
  .lane-stop {
    flex: none; height: 22px; padding: 0 9px; border-radius: 999px; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--red) 30%, transparent); background: color-mix(in srgb, var(--red) 6%, transparent);
    color: var(--red); font-size: 10.5px;
  }
  .lane-stop:hover { background: color-mix(in srgb, var(--red) 13%, transparent); }
  .lane-stop:disabled { opacity: .55; cursor: default; }
  .steps { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
  .step { display: flex; align-items: flex-start; gap: 7px; color: var(--faint); font-size: 11px; line-height: 1.5; }
  .step .sdot { flex: none; width: 6px; height: 6px; margin-top: 4px; border-radius: 50%; background: var(--line-strong); }
  .step.completed { color: var(--muted); }
  .step.completed .sdot { background: var(--green); }
  .step.running .sdot { background: var(--amber); animation: blink 1.1s infinite; }
  .step.failed { color: var(--red); }
  .step.failed .sdot { background: var(--red); }
  .lane-progress-text { margin-top: 5px; color: var(--faint); font-size: 10.5px; }

  /* ---- schedule rail: one square card per conversation, steps on tap ---- */
  .sched-rail {
    position: fixed; top: 58px; right: 0; bottom: 0; z-index: 19;
    width: 320px; display: flex; flex-direction: column;
    border-left: 1px solid var(--line); background: var(--bg);
    box-shadow: -18px 0 50px rgba(0, 0, 0, .32);
    transition: transform .18s ease-out;
  }
  .rail-toggle {
    position: absolute; left: 0; top: 10px; z-index: 2;
    width: 27px; height: 27px; padding: 0;
    border: 1px solid var(--line); border-left: 0; border-radius: 0 7px 7px 0;
    background: var(--panel-2); color: var(--muted); font-size: 14px; line-height: 1;
  }
  .rail-toggle:hover { color: var(--text); background: var(--panel-2); }
  .rail-strip { display: none; }
  body.rail-collapsed .sched-rail { transform: translateX(calc(100% - 34px)); }
  body.rail-collapsed .rail-main { visibility: hidden; }
  body.rail-collapsed .rail-strip {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    height: 100%; padding: 46px 0 16px;
  }
  .rail-strip-text {
    writing-mode: vertical-rl; letter-spacing: .18em;
    color: var(--muted); font-size: 10.5px;
  }
  .rail-count {
    min-width: 18px; padding: 1px 4px; border-radius: 9px; text-align: center;
    background: color-mix(in srgb, var(--amber) 16%, transparent); color: var(--amber); font-size: 10px;
  }
  .rail-count[hidden] { display: none; }
  .rail-main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .rail-head {
    display: flex; align-items: baseline; gap: 8px; padding: 13px 14px 9px 20px;
    border-bottom: 1px solid var(--line-soft);
  }
  .rail-head strong { font-size: 12px; }
  .rail-facts { color: var(--faint); font-size: 10.5px; }
  .rail-body { flex: 1; min-height: 0; overflow: auto; padding: 12px 14px 20px 20px; }
  .rail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .rail-card {
    position: relative; aspect-ratio: 1 / 1; min-width: 0; overflow: hidden;
    display: flex; flex-direction: column; gap: 3px;
    padding: 8px 9px; border: 1px solid var(--line-soft); border-radius: 10px;
    background: var(--panel-2); color: var(--text); text-align: left;
  }
  .rail-card:hover { border-color: var(--line-strong); background: var(--panel-2); }
  .rail-card.current { border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--panel-2); }
  .rail-card.k-attention, .rail-card.k-approval { border-color: color-mix(in srgb, var(--amber) 42%, transparent); background: color-mix(in srgb, var(--amber) 5%, transparent); }
  .rail-card.k-failed { border-color: color-mix(in srgb, var(--red) 32%, transparent); }
  .rail-card.k-done { border-color: color-mix(in srgb, var(--green) 22%, transparent); }
  .rail-card-top { display: flex; align-items: center; gap: 5px; min-width: 0; }
  .rail-dot { flex: none; width: 6px; height: 6px; border-radius: 50%; background: var(--line-strong); }
  .rail-dot.running { background: var(--amber); animation: blink 1.1s infinite; }
  .rail-dot.attention, .rail-dot.approval { background: var(--amber); }
  .rail-dot.done { background: var(--green); }
  .rail-dot.failed { background: var(--red); }
  .rail-state {
    min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted); font-size: 10px;
  }
  .rail-when { margin-left: auto; flex: none; color: var(--faint); font: 9.5px var(--mono); }
  .rail-title {
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    color: var(--text); font-size: 11.5px; line-height: 1.35; word-break: break-word;
  }
  .rail-now {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--amber); font-size: 9.5px;
  }
  .rail-now.idle { color: var(--faint); }
  .rail-meta {
    margin-top: auto; display: flex; flex-wrap: wrap; gap: 1px 6px;
    color: var(--faint); font-size: 9.5px; line-height: 1.4;
  }
  .rail-meta b { color: var(--muted); font-weight: 600; }
  .rail-empty { margin: 0; color: var(--faint); font-size: 11px; line-height: 1.6; }
  .rail-back {
    display: inline-flex; align-items: center; gap: 4px; margin: 0 0 9px; padding: 0;
    border: 0; background: transparent; color: var(--muted); font-size: 11px;
  }
  .rail-back:hover { color: var(--text); }
  .rail-detail-head { margin-bottom: 10px; }
  .rail-detail-title {
    margin: 0 0 4px; font-size: 12.5px; line-height: 1.4; word-break: break-word;
  }
  .rail-detail-facts { color: var(--faint); font-size: 10.5px; line-height: 1.55; }
  .rail-run {
    margin-bottom: 8px; padding: 8px 9px; border-radius: 9px;
    border: 1px solid var(--line-soft); background: var(--bg);
  }
  .rail-run:last-child { margin-bottom: 0; }
  .rail-run-head { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .rail-run-goal {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--muted); font-size: 11px;
  }
  .rail-elapsed { flex: none; color: var(--faint); font: 9.5px var(--mono); white-space: nowrap; }
  .rail-steps { display: flex; flex-direction: column; gap: 3px; margin-top: 6px; }
  .rail-steps .step { font-size: 10.5px; }
  .rail-step-text { min-width: 0; word-break: break-word; }
  .rail-step-note { color: var(--faint); }
  .rail-step-dur { flex: none; margin-left: auto; color: var(--faint); font: 9.5px var(--mono); white-space: nowrap; }
  .rail-note { margin: 0 0 8px; color: var(--faint); font-size: 10.5px; }
  /* Wide screens give the rail its own column; narrow ones overlay it below. */
  @media (min-width: 721px) {
    body.rail-open .stage { padding-right: 338px; }
  }

  .summary {
    margin-top: 10px; padding: 10px 11px; border-radius: 10px;
    border: 1px solid color-mix(in srgb, var(--green) 28%, transparent); background: color-mix(in srgb, var(--green) 5%, transparent);
  }
  .summary.bad { border-color: color-mix(in srgb, var(--red) 30%, transparent); background: color-mix(in srgb, var(--red) 5%, transparent); }
  .summary .st { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
  .summary .sd { margin-top: 3px; color: var(--faint); font-size: 11px; }
  .artifacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .artifact {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    padding: 4px 9px; border-radius: 8px; text-decoration: none;
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); background: color-mix(in srgb, var(--accent) 7%, transparent); color: var(--accent);
    font-size: 11.5px; font-family: inherit; text-align: left; cursor: pointer;
  }
  .artifact:hover { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .artifact .ak { color: var(--faint); font: 10px var(--mono); }
  .artifact .an { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sum-run { margin-top: 8px; }
  .sum-run-title { color: var(--muted); font-size: 11.5px; margin-bottom: 4px; }
  .msg.flash .bubble { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); transition: box-shadow .2s; }

  /* ---- drawers ---- */
  .scrim { position: fixed; inset: 58px 0 0; z-index: 20; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(2px); }
  .scrim[hidden] { display: none; }
  .drawer {
    position: fixed; top: 58px; right: 0; bottom: 0; z-index: 21;
    width: min(430px, calc(100vw - 40px));
    display: flex; flex-direction: column;
    border-left: 1px solid var(--line); background: var(--panel);
    box-shadow: -30px 0 80px rgba(0, 0, 0, .45);
    animation: slideIn .18s ease-out;
  }
  .drawer[hidden] { display: none; }
  @keyframes slideIn { from { transform: translateX(16px); opacity: .4; } to { transform: none; opacity: 1; } }
  .drawer-head { display: flex; align-items: flex-start; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--line-soft); }
  .drawer-head h2 { margin: 2px 0 0; font-size: 14px; }
  .drawer-head .kicker { color: var(--accent); font: 10px var(--mono); letter-spacing: .14em; text-transform: uppercase; }
  .drawer-close { margin-left: auto; border: 0; background: transparent; color: var(--muted); font-size: 18px; line-height: 1; }
  .drawer-body { flex: 1; min-height: 0; overflow: auto; padding: 14px 16px 24px; }
  .adv-sec { padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--line-soft); }
  .adv-sec:last-child { border-bottom: 0; margin-bottom: 0; }
  .adv-sec h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .adv-kv { display: grid; gap: 5px; }
  .adv-row { display: flex; gap: 10px; align-items: baseline; justify-content: space-between; }
  .adv-label { color: var(--faint); font-size: 11px; }
  .adv-row code { color: var(--muted); font: 11px var(--mono); word-break: break-all; text-align: right; }
  .adv-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .adv-note { margin: 8px 0 0; color: var(--faint); font-size: 11px; line-height: 1.6; }
  .adv-runs { display: flex; flex-direction: column; gap: 8px; }
  .adv-run { padding: 9px 10px; border-radius: 8px; border: 1px solid var(--line-soft); background: var(--bg); }
  .adv-run .t { color: var(--muted); font-size: 11.5px; margin-bottom: 3px; word-break: break-word; }
  .adv-run .m { color: var(--faint); font: 10.5px var(--mono); word-break: break-all; }
  .adv-run .btn { margin-top: 7px; }
  .hist-item {
    display: block; width: 100%; margin-bottom: 10px; padding: 10px 11px;
    border: 1px solid var(--line-soft); border-radius: 10px; background: var(--panel);
    color: var(--text); text-align: left; cursor: pointer;
  }
  .hist-item:hover { border-color: var(--line-strong); }
  .hist-item.current { border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: var(--panel-2); cursor: default; }
  .hist-state + .hist-state { margin-left: 6px; }
  .hist-top { display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 10.5px; }
  .hist-state { margin-left: auto; }
  .hist-text { margin-top: 4px; font-size: 12px; line-height: 1.55; word-break: break-word; }

  @media (max-width: 720px) {
    .stage { padding: 0 10px 10px; }
    .topbar { padding: 0 12px; gap: 10px; }
    .topbar-actions .conn { display: none; }
    .brand { min-width: 0; }
    .brand div span { display: none; }
    .hint { display: none; }
    .messages { padding: 16px 14px 22px; }
    /* The rail floats over the thread instead of squeezing it into a column. */
    .sched-rail { width: min(320px, calc(100vw - 42px)); box-shadow: -26px 0 60px rgba(0, 0, 0, .55); }
    .rail-head { padding-left: 16px; }
    .rail-body { padding-left: 14px; }
    .rail-grid { gap: 7px; }
  }

  /* ——— 控件与宿主对齐 ———
     尺寸取自宿主的输入栏与设置页：按钮 32px 高、8px 圆角、13px/500；
     输入框无边框、底色用 specific-input-major；焦点环 2px 用
     state-business-primary；滚动条用 scrollbar-bg-l1。 */
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn, .examples button, .free button, .wiz-primary, .wiz-secondary,
  .gate-card button, .approval-card .options button, .msg-actions button,
  .rail-toggle, .drawer-close, .adv-actions .btn {
    height: 32px; padding: 0 12px; border-radius: 8px;
    font-size: 13px; font-weight: 500;
    transition: background .12s ease, border-color .12s ease, color .12s ease;
  }
  .btn { border-color: var(--line); background: transparent; color: var(--muted); }
  .btn:hover, .examples button:hover, .wiz-secondary:hover, .rail-toggle:hover,
  .drawer-close:hover, .approval-card .options button:hover {
    background: var(--hover); color: var(--text); border-color: transparent;
  }
  .btn:active, .examples button:active, .free button:active, .wiz-primary:active,
  .wiz-secondary:active, .gate-card button:active, .approval-card .options button:active,
  .msg-actions button:active, .rail-toggle:active, .drawer-close:active { background: var(--active); }
  .btn:disabled, .free button:disabled, .wiz-primary:disabled, .wiz-secondary:disabled,
  .gate-card button:disabled {
    opacity: .4; cursor: default; pointer-events: none;
  }
  .wiz-primary, .send, .gate-card button, .free button {
    border-color: transparent; background: var(--primary-bg); color: var(--primary-fg);
  }
  .wiz-primary:hover, .gate-card button:hover, .free button:hover {
    background: color-mix(in srgb, var(--primary-bg) 88%, var(--text)); color: var(--primary-fg);
  }
  .send { width: 32px; height: 32px; padding: 0; border-radius: 999px; }
  .btn.danger, .approval-card .options button.reject { color: var(--red); }
  .btn.danger:hover, .approval-card .options button.reject:hover {
    background: color-mix(in srgb, var(--red) 12%, transparent); color: var(--red);
  }
  .btn.tiny { height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12px; }

  .free input, .wiz-field input, .gate-card input, .composer textarea, .composer-box {
    background: var(--input-bg); color: var(--text);
  }
  .free input, .wiz-field input, .gate-card input { border-radius: 8px; }
  .composer-box { border-radius: var(--radius); }
  .composer-box:focus-within {
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent);
  }
  .free input:focus, .wiz-field input:focus, .gate-card input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 25%, transparent);
    outline: 0;
  }

  .segmented { border-color: transparent; background: var(--hover); border-radius: 8px; }
  .segmented button { height: 26px; padding: 0 10px; border-radius: 6px; font-size: 12px; }
  .segmented button.active { background: var(--card-bg); color: var(--text); }

  .badge, .status-pill, .tool-name, .wiz-badge, .rail-state, .count {
    border-radius: 999px; font-size: 12px; font-weight: 500;
  }
  .rail-card, .notice-item, .hist-item, .summary, .artifact, .tool, .msg .bubble {
    border-radius: 12px;
  }
  .toast { background: var(--toast-bg); color: var(--toast-fg); border-radius: 12px; font-size: 13px; }
  .toast.ok, .toast.warn, .toast.err { background: var(--toast-bg); }

  :root { --divider: var(--line-soft); }
  *::-webkit-scrollbar { width: 10px; height: 10px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb {
    background: var(--scroll-thumb); border: 3px solid transparent;
    background-clip: padding-box; border-radius: 999px;
  }
  *::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); background-clip: padding-box; }
  * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="mark">S</div>
      <div><strong>Superagent</strong><span>控制台</span></div>
    </div>
    <div class="topbar-mid">
      <span id="modeBadge" class="badge"><span class="pulse"></span><span id="modeText">连接中</span></span>
      <span id="sessionLabel" class="session-label mono" hidden></span>
    </div>
    <div class="topbar-actions">
      <span id="conn" class="conn"><i></i><span id="connText">连接中</span></span>
      <button id="stopAll" class="btn danger" type="button" hidden>停止这一轮</button>
      <button id="noticeOpen" class="btn notice-btn" type="button" hidden>提醒<span id="noticeCount" class="count">0</span></button>
      <button id="newChatTop" class="btn" type="button" disabled>新对话</button>
      <button id="historyOpen" class="btn" type="button">历史</button>
      <button id="advancedOpen" class="btn" type="button">高级</button>
    </div>
  </header>

  <div id="envBar" class="env-bar" hidden>
    <span class="env-title">需要处理</span>
    <div id="envItems" class="env-items"></div>
    <button id="envWizard" class="btn tiny" type="button">去配置</button>
  </div>

  <main class="stage">
    <section class="panel chat" aria-label="对话">
      <div class="chat-head">
        <div>
          <h1>Superagent</h1>
          <p>说一句要做什么；它自己决定一步做完还是拆开并行，跑完在这里汇总</p>
        </div>
        <div id="typing" class="typing" hidden><span></span><span></span><span></span><em id="typingText" style="font-style:normal;margin-left:3px">运行中</em></div>
      </div>
      <div id="messages" class="messages" aria-live="polite"></div>      <form id="composer" class="composer" autocomplete="off">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="要做什么…" disabled></textarea>
          <div class="composer-bar">
            <span class="hint">Enter 发送 · Shift+Enter 换行</span>
            <button id="send" class="send" type="submit" aria-label="发送" disabled>↑</button>
          </div>
        </div>
      </form>
    </section>
  </main>
</div>

<div id="scrim" class="scrim" hidden></div>

<div id="noticePanel" class="notice-panel" hidden>
  <div class="notice-head">
    <span class="kicker">提醒</span>
    <button id="noticeReadAll" class="btn tiny" type="button">全部已读</button>
  </div>
  <div id="noticeList" class="notice-list"></div>
</div>

<aside id="historyDrawer" class="drawer" hidden aria-label="历史">
  <div class="drawer-head">
    <div>
      <span class="kicker">历史</span>
      <h2>你的对话</h2>
    </div>
    <button class="drawer-close" data-close="history" type="button" aria-label="关闭">×</button>
  </div>
  <div id="historyList" class="drawer-body"></div>
</aside>

<aside id="advancedDrawer" class="drawer" hidden aria-label="高级">
  <div class="drawer-head">
    <div>
      <span class="kicker">高级</span>
      <h2>运行细节</h2>
    </div>
    <button class="drawer-close" data-close="advanced" type="button" aria-label="关闭">×</button>
  </div>
  <div class="drawer-body">
    <section class="adv-sec">
      <h3>会话</h3>
      <div id="advSession" class="adv-kv"></div>
      <div class="adv-actions">
        <button id="wizardOpen" class="btn tiny" type="button">配置向导</button>
      </div>
    </section>
    <section class="adv-sec">
      <h3>发送方式</h3>
      <div class="segmented" role="group" aria-label="发送方式">
        <button type="button" data-mode="queue" class="active">排队</button>
        <button type="button" data-mode="steer">插话</button>
      </div>
      <p class="adv-note">排队：等这一轮结束后再发。插话：立刻打断这一轮。</p>
    </section>
    <section class="adv-sec">
      <h3>挂载的工具 <span id="toolCount" class="count">—</span></h3>
      <p id="toolNote" class="tools-note">加载中…</p>
      <div id="toolList" class="tool-list"></div>
    </section>
    <section class="adv-sec">
      <h3>任务线细节</h3>
      <div id="advRuns" class="adv-runs"></div>
    </section>
  </div>
</aside>

<div id="gate" class="gate" hidden>
  <form id="gateForm" class="gate-card">
    <div class="mark">S</div>
    <h1>连接 Superagent 控制台</h1>
    <p>token 在宿主状态目录的 <code>console.json</code> 里，每次启动都会换。控制台只监听 127.0.0.1。</p>
    <label for="tokenInput">token</label>
    <input id="tokenInput" type="password" autocomplete="off" spellcheck="false" placeholder="粘贴 token">
    <button type="submit">连接</button>
    <p id="gateError" class="error"></p>
  </form>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<aside id="schedRail" class="sched-rail" aria-label="会话调度">
  <button id="railToggle" class="rail-toggle" type="button" aria-label="收起调度" title="收起调度">›</button>
  <div class="rail-strip" aria-hidden="true">
    <span class="rail-strip-text">调度</span>
    <b id="railCount" class="rail-count">0</b>
  </div>
  <div class="rail-main">
    <div class="rail-head">
      <strong>会话</strong>
      <span id="railFacts" class="rail-facts"></span>
    </div>
    <div id="railBody" class="rail-body"></div>
  </div>
</aside>

<dialog id="wizardDialog">
  <div class="wiz-head">
    <div>
      <span class="kicker">首次配置</span>
      <h2>填好配置，当场试跑</h2>
    </div>
    <button id="wizardClose" type="button" aria-label="关闭">×</button>
  </div>
  <div id="wizardSteps" class="wiz-steps"></div>
  <div id="wizardBody" class="wiz-body"></div>
  <div id="wizardFoot" class="wiz-foot"></div>
</dialog>

<dialog id="reportDialog">
  <div class="dialog-head">
    <h2 id="dialogTitle">报告</h2>
    <button id="dialogClose" type="button" aria-label="关闭">×</button>
  </div>
  <div class="dialog-body">
    <div id="dialogMeta" class="dialog-meta"></div>
    <div id="dialogReport" class="dialog-report"></div>
    <div id="dialogActions" class="dialog-actions" hidden></div>
  </div>
</dialog>

<script>
(() => {
  'use strict'

  const TOKEN_KEY = 'dsh-superagent-console-token'
  const $ = id => document.getElementById(id)
  const messagesEl = $('messages')
  const inputEl = $('input')
  const sendEl = $('send')
  const composerEl = $('composer')
  const typingEl = $('typing')
  const typingTextEl = $('typingText')
  const modeBadgeEl = $('modeBadge')
  const modeTextEl = $('modeText')
  const sessionLabelEl = $('sessionLabel')
  const connEl = $('conn')
  const connTextEl = $('connText')
  const newChatEl = $('newChatTop')
  const stopAllEl = $('stopAll')
  const gateEl = $('gate')
  const gateFormEl = $('gateForm')
  const gateErrorEl = $('gateError')
  const tokenInputEl = $('tokenInput')
  const toastsEl = $('toasts')
  const reportDialogEl = $('reportDialog')
  const dialogTitleEl = $('dialogTitle')
  const dialogMetaEl = $('dialogMeta')
  const dialogReportEl = $('dialogReport')
  const dialogActionsEl = $('dialogActions')
  const wizardDialogEl = $('wizardDialog')
  const wizardStepsEl = $('wizardSteps')
  const wizardBodyEl = $('wizardBody')
  const wizardFootEl = $('wizardFoot')
  const envBarEl = $('envBar')
  const envItemsEl = $('envItems')
  const scrimEl = $('scrim')
  const historyDrawerEl = $('historyDrawer')
  const historyListEl = $('historyList')
  const advancedDrawerEl = $('advancedDrawer')
  const advSessionEl = $('advSession')
  const advRunsEl = $('advRuns')
  const noticeOpenEl = $('noticeOpen')
  const noticeCountEl = $('noticeCount')
  const noticePanelEl = $('noticePanel')
  const noticeListEl = $('noticeList')
  const railToggleEl = $('railToggle')
  const railBodyEl = $('railBody')
  const railFactsEl = $('railFacts')
  const railCountEl = $('railCount')
  const RAIL_KEY = 'dsh-superagent-rail-collapsed'

  // Upload rules mirror the server's: the page refuses early with a readable
  // sentence, and the server refuses again because a page is not a gate.
  const UPLOAD_MAX = 8 * 1024 * 1024
  const UPLOAD_EXTS = new Set([
    '.png', '.jpg', '.jpeg', '.gif', '.webp', '.svg', '.bmp',
    '.pdf', '.md', '.markdown', '.txt', '.log', '.csv', '.tsv', '.json', '.yml', '.yaml', '.xml',
    '.doc', '.docx', '.xls', '.xlsx', '.ppt', '.pptx', '.rtf',
    '.zip', '.tar', '.gz', '.7z',
    '.js', '.mjs', '.cjs', '.ts', '.tsx', '.jsx', '.py', '.css', '.html', '.htm', '.sql', '.sh',
    '.ps1', '.toml', '.ini', '.ipynb',
  ])
  const UPLOAD_HINT = '图片、PDF、Markdown/文本、CSV/JSON、Office 文档、压缩包或代码文件'

  const STATE = {
    token: '',
    mode: 'loading',
    capabilities: null,
    sessionId: null,
    runs: [],
    messages: [],
    running: false,
    pendingInput: [],
    conn: 'connecting',
    streamAbort: null,
    reconnectTimer: null,
    sending: false,
    sendMode: 'queue',
    messageSeq: 0,
    currentAssistant: null,
    toolCalls: new Map(),
    drafts: new Map(),
    busyAnswers: new Set(),
    autoScroll: true,
    booted: false,
    preset: null,
    laneEls: new Map(),
    runAnchors: new Map(),
    schedules: [],
    schedulesNote: null,
    schedulesBusy: false,
    railDetail: null,
    railSig: '',
    attentionSeen: new Set(),
    approvals: new Map(),
    sessions: [],
    sessionsLoadedAt: 0,
    sessionsBusy: false,
    sessionNote: null,
    cancelRequested: new Set(),
    stopAllBusy: false,
    notices: [],
    readNotices: new Set(),
    noticeOpen: false,
    noticesPrimed: false,
    dragDepth: 0,
  }

  const WIZ = {
    status: null,
    step: 1,
    open: false,
    busy: null,
    statusPending: 0,
    form: { provider: '', baseURL: '', model: '', apiKey: '' },
    formTouched: false,
    preview: null,
    saved: null,
    trial: null,
    error: null,
    autoOpened: false,
  }

  function el(tag, className, text) {
    const node = document.createElement(tag)
    if (className) node.className = className
    if (text !== undefined && text !== null) node.textContent = text
    return node
  }

  function messageOf(error) {
    if (!error) return '未知错误'
    return error.message || String(error)
  }

  function shortId(id) {
    if (typeof id !== 'string') return ''
    return id.length > 18 ? `${id.slice(0, 8)}…${id.slice(-6)}` : id
  }

  function timeLabel(value) {
    const ms = typeof value === 'number' ? value : Date.parse(value)
    if (!Number.isFinite(ms)) return ''
    try {
      return new Date(ms).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
    } catch {
      return ''
    }
  }

  function formatTokens(value) {
    const n = Number(value)
    if (!Number.isFinite(n) || n <= 0) return '—'
    if (n >= 1_000_000) return `${(n / 1_000_000).toFixed(1)}M`
    if (n >= 1_000) return `${(n / 1_000).toFixed(1)}k`
    return String(Math.round(n))
  }

  function statusText(status) {
    const map = {
      queued: '排队中', planning: '拆步骤中', running: '运行中', aggregating: '汇总中',
      completed: '已完成', failed: '失败', cancelled: '已取消', interrupted: '已中断',
      blocked: '已阻塞',
    }
    return map[status] || status || '未知'
  }

  function statusClass(status) {
    if (status === 'completed') return 'completed'
    if (status === 'failed' || status === 'cancelled' || status === 'interrupted' || status === 'blocked') return 'failed'
    if (status === 'queued') return 'queued'
    return 'running'
  }

  function contentText(content) {
    if (typeof content === 'string') return content
    if (!Array.isArray(content)) return ''
    return content
      .filter(part => part && part.type === 'text' && typeof part.text === 'string')
      .map(part => part.text)
      .join('')
  }

  function pushToast(text, kind = '') {
    const node = el('div', `toast ${kind}`.trim(), text)
    toastsEl.append(node)
    setTimeout(() => {
      node.style.opacity = '0'
      node.style.transition = 'opacity .18s'
      setTimeout(() => node.remove(), 220)
    }, 3600)
  }

  function setConn(state, text) {
    STATE.conn = state
    connEl.className = `conn ${state === 'live' ? 'live' : state === 'warn' ? 'warn' : ''}`.trim()
    connTextEl.textContent = text
  }

  function setMode(mode, capabilities) {
    STATE.mode = mode
    STATE.capabilities = capabilities || STATE.capabilities
    const chat = mode === 'chat'
    modeBadgeEl.className = `badge ${chat ? 'chat' : 'off'}`
    modeTextEl.textContent = chat ? '已就绪' : mode === 'loading' ? '连接中' : '未连接'
    newChatEl.disabled = !chat
    inputEl.disabled = !chat
    syncStopAll()
    updateSend()
  }

  function updateSend() {
    const hasText = inputEl.value.trim().length > 0
    sendEl.disabled = STATE.mode !== 'chat' || !hasText || STATE.sending
  }

  function setTyping(running, label) {
    STATE.running = running
    typingEl.hidden = !running
    if (label) typingTextEl.textContent = label
  }

  function setSession(sessionId) {
    STATE.sessionId = sessionId
    if (STATE.router) return
    sessionLabelEl.textContent = sessionId ? `session ${shortId(sessionId)}` : '没有会话'
    sessionLabelEl.title = sessionId || '宿主会话 id'
  }

  function scrollToEnd() {
    if (!STATE.autoScroll) return
    messagesEl.scrollTop = messagesEl.scrollHeight
  }

  function renderText(container, text, streaming) {
    container.textContent = ''
    const value = typeof text === 'string' ? text : ''
    const parts = value.split(/```/)
    parts.forEach((part, index) => {
      if (index % 2 === 1) {
        const pre = el('pre')
        const code = el('code')
        code.textContent = part.replace(/^[a-zA-Z0-9_+-]*\n/, '')
        pre.append(code)
        container.append(pre)
      } else if (part) {
        const block = el('div', 'para')
        block.textContent = part
        container.append(block)
      }
    })
    if (streaming) container.append(el('span', 'cursor'))
  }

  function messageElement(message) {
    const article = el('article', `msg ${message.role}${message.pending ? ' pending' : ''}${message.failed ? ' failed' : ''}`)
    article.dataset.id = message.id
    const who = el('div', 'who', message.role === 'user' ? '你' : 'Superagent')
    const bubble = el('div', 'bubble')
    const text = el('div', 'text')
    renderText(text, message.text, message.streaming)
    bubble.append(text)

    if (message.reasoning) {
      const details = el('details', 'reasoning')
      details.append(el('summary', '', '思考过程'))
      const pre = el('pre', '', message.reasoning)
      details.append(pre)
      bubble.append(details)
    }

    // Always attach the container: tool calls usually arrive after the message
    // element is built, and a detached container would swallow every chip.
    const tools = el('div', 'tools')
    if (Array.isArray(message.tools) && message.tools.length > 0) {
      for (const tool of message.tools) {
        tools.append(toolChip(tool))
      }
    }
    bubble.append(tools)

    const meta = el('div', 'meta')
    const when = message.at ? timeLabel(message.at) : ''
    meta.textContent = when
    if (message.pending) meta.append(el('span', '', ' · 发送中'))
    if (message.failed) meta.append(el('span', 'failed', ' · 发送失败'))
    if (message.interrupted) meta.append(el('span', '', ' · 已中断'))

    const actions = el('div', 'msg-actions')
    actions.hidden = !message.text
    if (message.role === 'assistant') {
      const copy = el('button', '', '复制')
      copy.type = 'button'
      copy.title = '复制这条回复的全文'
      copy.addEventListener('click', () => copyMessage(message, copy))
      actions.append(copy)
    } else {
      const edit = el('button', '', '编辑并重发')
      edit.type = 'button'
      edit.title = '把原文放回输入框，改完再发'
      edit.addEventListener('click', () => editMessage(message))
      actions.append(edit)
    }

    article.append(who, bubble, meta, actions)
    message.el = article
    message.textEl = text
    message.bubbleEl = bubble
    message.toolsEl = tools
    message.metaEl = meta
    message.actionsEl = actions
    return article
  }

  function formatTextOf(message) {
    return typeof message.text === 'string' ? message.text : ''
  }

  async function copyText(value) {
    const text = typeof value === 'string' ? value : ''
    if (!text) return false
    if (navigator.clipboard?.writeText) {
      try {
        await navigator.clipboard.writeText(text)
        return true
      } catch {
        // The page may not be a secure context; fall through to the old path.
      }
    }
    const area = document.createElement('textarea')
    area.value = text
    area.setAttribute('readonly', '')
    area.style.position = 'fixed'
    area.style.top = '-1000px'
    document.body.append(area)
    area.select()
    let copied = false
    try { copied = document.execCommand('copy') } catch { copied = false }
    area.remove()
    return copied
  }

  async function copyMessage(message, button) {
    const copied = await copyText(formatTextOf(message))
    if (!copied) {
      pushToast('复制失败。手动选中文字再复制。', 'err')
      return
    }
    pushToast('已复制。', 'ok')
    button.textContent = '已复制'
    setTimeout(() => { button.textContent = '复制' }, 1600)
  }

  /** Put the original text back in the composer; sending stays the person's call. */
  function editMessage(message) {
    const text = formatTextOf(message)
    if (!text) return
    inputEl.value = text
    inputEl.dispatchEvent(new Event('input'))
    inputEl.focus()
    try { inputEl.setSelectionRange(text.length, text.length) } catch { /* not focusable yet */ }
    pushToast('已放回输入框，改完点发送。', 'ok')
  }

  function summarizeArgs(value) {
    if (value === undefined || value === null) return ''
    let text
    if (typeof value === 'string') text = value
    else {
      try { text = JSON.stringify(value) } catch { text = String(value) }
    }
    return text.replace(/\s+/g, ' ').trim().slice(0, 110)
  }

  function toolChip(tool) {
    const chip = el('span', `tool ${tool.status || 'running'}`.trim())
    chip.dataset.callId = tool.callId || ''
    chip.append(el('span', 'tdot'))
    chip.append(el('span', '', tool.name || 'tool'))
    const args = summarizeArgs(tool.arguments)
    if (args) {
      const code = el('code', 'targs', args)
      code.title = typeof tool.arguments === 'string' ? tool.arguments.slice(0, 2000) : args
      chip.append(code)
    }
    const failed = tool.status === 'err'
    if (tool.done) {
      const details = el('details')
      details.append(el('summary', failed ? 'err-mark' : '', failed ? '失败原因' : '结果'))
      details.append(el('pre', '', tool.result || (failed ? '工具没有给出错误说明。' : '')))
      chip.append(details)
    }
    return chip
  }

  function refreshMessage(message) {
    if (!message || !message.el) return
    message.el.classList.toggle('pending', Boolean(message.pending))
    message.el.classList.toggle('failed', Boolean(message.failed))
    renderText(message.textEl, message.text, message.streaming)
    if (message.metaEl) {
      message.metaEl.textContent = message.at ? timeLabel(message.at) : ''
      if (message.pending) message.metaEl.append(el('span', '', ' · 发送中'))
      if (message.failed) message.metaEl.append(el('span', 'failed', ' · 发送失败'))
      if (message.interrupted) message.metaEl.append(el('span', '', ' · 已中断'))
    }
    if (message.actionsEl) message.actionsEl.hidden = !message.text
  }

  function addMessage(role, text, options = {}) {
    const message = {
      id: options.id || `m${++STATE.messageSeq}`,
      role,
      text: text || '',
      reasoning: options.reasoning || '',
      streaming: options.streaming === true,
      pending: options.pending === true,
      failed: false,
      interrupted: false,
      at: options.at || Date.now(),
      tools: [],
    }
    STATE.messages.push(message)
    const node = messageElement(message)
    // A task lane with no user message sits at the end; keep new turns above it.
    const orphan = STATE.laneEls.get('')
    if (orphan && orphan.parentNode === messagesEl) messagesEl.insertBefore(node, orphan)
    else messagesEl.append(node)
    if (role === 'assistant') STATE.currentAssistant = message
    scrollToEnd()
    return message
  }

  function clearMessages() {
    STATE.messages = []
    STATE.currentAssistant = null
    STATE.toolCalls.clear()
    resetLanes()
    messagesEl.textContent = ''
  }

  function renderEmpty() {
    if (STATE.messages.length > 0) return
    const wrap = el('div', 'empty')
    wrap.id = 'empty'
    if (STATE.mode !== 'chat') {
      wrap.classList.add('unavailable')
      wrap.append(el('div', 'orb', '!'))
      wrap.append(el('h1', '', '这里不能对话'))
      wrap.append(el('p', '', '宿主没有可用的会话，所以这里不能开始对话。'))
      if (STATE.capabilities?.reason) wrap.append(el('div', 'reason', STATE.capabilities.reason))
      messagesEl.append(wrap)
      return
    }
    wrap.append(el('div', 'orb', 'S'))
    wrap.append(el('h1', '', '要做什么？'))
    wrap.append(el('p', '', '写下要做的事。它自己决定一步做完，还是拆成几条同时做；跑完在这里汇总，能点开的产物也放在这里。'))
    const examples = el('div', 'examples')
    const samples = [
      '把这周的项目进度整理成一页 HTML 报告',
      '先查清登录失败的根因，再修掉',
      '把这份需求拆成并行任务，最后汇总',
    ]
    for (const sample of samples) {
      const button = el('button', '', sample)
      button.type = 'button'
      button.addEventListener('click', () => {
        inputEl.value = sample
        autoGrow()
        updateSend()
        inputEl.focus()
      })
      examples.append(button)
    }
    wrap.append(examples)
    messagesEl.append(wrap)
  }

  function removeEmpty() {
    const node = $('empty')
    if (node) node.remove()
  }

  function autoGrow() {
    inputEl.style.height = 'auto'
    inputEl.style.height = `${Math.min(180, Math.max(46, inputEl.scrollHeight))}px`
  }

  // ---------- notices ----------
  //
  // A finished run, a failure and a pending decision are all durable on the
  // host. The page turns them into the same short list every time it loads, so
  // closing the tab loses nothing: reopening shows "跑完了" or "要你批准" again.
  // Only the ids a person has already read travel back to the server.

  function noticeWhen(at) {
    const ms = typeof at === 'number' ? at : Date.parse(at)
    if (!Number.isFinite(ms)) return ''
    const diff = Date.now() - ms
    if (diff < 60_000) return '刚刚'
    if (diff < 3_600_000) return `${Math.max(1, Math.floor(diff / 60000))} 分钟前`
    return timeLabel(ms)
  }

  function collectNotices() {
    const out = []
    for (const run of Array.isArray(STATE.runs) ? STATE.runs : []) {
      if (!run || typeof run.id !== 'string') continue
      const goal = String(run.goal || '这条任务线').replace(/\s+/g, ' ').slice(0, 64)
      const question = Array.isArray(run.attention) && run.attention.length > 0 ? run.attention[0] : null
      if (question) {
        out.push({
          id: `run:${run.id}:attention`,
          kind: 'approval',
          runId: run.id,
          title: '要你批准',
          detail: `${goal} · ${question.question || '在等一个决定'}`,
          at: question.askedAt || run.finishedAt || run.createdAt,
        })
      }
      if (!isTerminal(run.status)) continue
      const failed = run.status !== 'completed'
      out.push({
        id: `run:${run.id}:${run.status}`,
        kind: failed ? 'failed' : 'done',
        runId: run.id,
        title: failed ? (run.status === 'cancelled' ? '已取消' : '没走通') : '跑完了',
        detail: `${goal} · ${statusText(run.status)}`,
        at: run.finishedAt || run.createdAt,
      })
    }
    for (const entry of STATE.approvals.values()) {
      const approval = entry.approval || {}
      if (!approval.id) continue
      out.push({
        id: `approval:${approval.id}`,
        kind: 'approval',
        title: '要你批准',
        detail: `工具 ${approval.toolName || 'tool'} 在等你决定`,
        at: approval.askedAt,
      })
    }
    out.sort((left, right) => (Date.parse(right.at) || 0) - (Date.parse(left.at) || 0))
    return out.slice(0, 30)
  }

  function unreadNotices() {
    return STATE.notices.filter(notice => !STATE.readNotices.has(notice.id))
  }

  function renderNoticeBadge() {
    const unread = unreadNotices().length
    noticeOpenEl.hidden = STATE.notices.length === 0
    noticeCountEl.textContent = unread > 99 ? '99+' : String(unread)
    noticeOpenEl.classList.toggle('has-unread', unread > 0)
    noticeOpenEl.title = unread > 0 ? `${unread} 条没看过的提醒` : '提醒'
    const base = 'Superagent 控制台'
    document.title = unread > 0 ? `(${unread}) ${base}` : base
    if (!noticePanelEl.hidden) renderNoticeList()
  }

  function renderNoticeList() {
    noticeListEl.textContent = ''
    if (STATE.notices.length === 0) {
      noticeListEl.append(el('div', 'notice-empty', '没有提醒。任务跑完、失败或等你批准时会出现在这里。'))
      return
    }
    for (const notice of STATE.notices) {
      const unread = !STATE.readNotices.has(notice.id)
      const item = el('div', `notice-item${unread ? ' unread' : ''}`)
      item.dataset.id = notice.id
      item.append(el('span', 'dot'))
      const body = el('div', 'body')
      body.append(el('div', 'title', notice.title))
      body.append(el('div', 'detail', notice.detail))
      body.append(el('div', 'when', noticeWhen(notice.at)))
      item.append(body)
      item.addEventListener('click', () => {
        markNoticesRead([notice.id])
        if (notice.runId) openReport(notice.runId)
        closeNoticePanel()
      })
      noticeListEl.append(item)
    }
  }

  function refreshNotices({ toastNew = false } = {}) {
    const previous = new Set(STATE.notices.map(notice => notice.id))
    // The first pass only paints what already happened; a toast is for a
    // change that arrives while the page is open.
    const primed = STATE.noticesPrimed === true
    STATE.notices = collectNotices()
    STATE.noticesPrimed = true
    if (toastNew && primed) {
      for (const notice of STATE.notices) {
        if (previous.has(notice.id)) continue
        if (notice.kind === 'done') pushToast(`跑完了：${notice.detail}`, 'ok')
        else if (notice.kind === 'failed') pushToast(`${notice.title}：${notice.detail}`, 'err')
        else if (notice.kind === 'approval') pushToast(`要你批准：${notice.detail}`, 'warn')
      }
    }
    renderNoticeBadge()
  }

  function markNoticesRead(ids) {
    const fresh = (Array.isArray(ids) ? ids : []).filter(id => id && !STATE.readNotices.has(id))
    if (fresh.length === 0) return
    for (const id of fresh) STATE.readNotices.add(id)
    renderNoticeBadge()
    api('/api/console/notices/read', { method: 'POST', body: { ids: fresh } }).catch(() => {})
  }

  function openNoticePanel() {
    STATE.noticeOpen = true
    noticePanelEl.hidden = false
    renderNoticeList()
    // Opening the list is reading it: the badge clears, the lines stay.
    markNoticesRead(STATE.notices.map(notice => notice.id))
  }

  function closeNoticePanel() {
    STATE.noticeOpen = false
    noticePanelEl.hidden = true
  }

  // ---------- files ----------
  //
  // A dropped or pasted file is copied into the conversation's workspace by
  // the host, and the path it returns is what the message carries. Nothing is
  // uploaded to a third party, and nothing outside the workspace is written.

  function uploadExtOf(name) {
    const text = typeof name === 'string' ? name : ''
    const dot = text.lastIndexOf('.')
    return dot >= 0 ? text.slice(dot).toLowerCase() : ''
  }

  function uploadSizeText(bytes) {
    const size = Number(bytes) || 0
    if (size >= 1024 * 1024) return `${(size / (1024 * 1024)).toFixed(1)}MB`
    if (size >= 1024) return `${Math.round(size / 1024)}KB`
    return `${size}B`
  }

  function base64OfBytes(bytes) {
    let binary = ''
    const chunk = 0x8000
    for (let index = 0; index < bytes.length; index += chunk) {
      binary += String.fromCharCode.apply(null, bytes.subarray(index, index + chunk))
    }
    return btoa(binary)
  }

  function insertUploadPath(filePath) {
    if (!filePath) return
    const current = inputEl.value
    const separator = current.length === 0 || current.endsWith('\n') ? '' : '\n'
    inputEl.value = `${current}${separator}${filePath}\n`
    autoGrow()
    updateSend()
    inputEl.focus()
    try { inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length) } catch { /* not focusable yet */ }
  }

  async function uploadFiles(files) {
    const list = Array.from(files || []).filter(Boolean)
    if (list.length === 0) return
    if (STATE.mode !== 'chat') {
      pushToast('还没连上，等对话准备好再放文件。', 'err')
      return
    }
    for (const file of list) {
      const ext = uploadExtOf(file.name)
      if (!UPLOAD_EXTS.has(ext)) {
        pushToast(`不能放 ${ext || '没有扩展名的'} 文件。可以放：${UPLOAD_HINT}。`, 'err')
        continue
      }
      if (file.size > UPLOAD_MAX) {
        pushToast(`${file.name} 有 ${uploadSizeText(file.size)}，超过 ${uploadSizeText(UPLOAD_MAX)} 上限。`, 'err')
        continue
      }
      if (file.size === 0) {
        pushToast(`${file.name} 是空文件，没放进去。`, 'err')
        continue
      }
      try {
        const bytes = new Uint8Array(await file.arrayBuffer())
        const data = await api('/api/console/upload', {
          method: 'POST',
          body: { sessionId: STATE.sessionId, name: file.name, data: base64OfBytes(bytes) },
        })
        insertUploadPath(data.path)
        pushToast(`已放进工作区：${data.name}。路径写进了消息。`, 'ok')
      } catch (error) {
        const hint = error.hint ? `。${error.hint}` : ''
        pushToast(`放不进去：${messageOf(error)}${hint}`, 'err')
      }
    }
  }

  function dragHasFiles(event) {
    const transfer = event.dataTransfer
    if (!transfer) return false
    if (transfer.files && transfer.files.length > 0) return true
    return Array.from(transfer.types || []).includes('Files')
  }

  // ---------- task lanes ----------
